<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">talk  Step 10 — Share out!</text>
<text x="480" y="97" font-size="19" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Share your most surprising weighing result, then say the science words!</text><rect x="60" y="116" width="840" height="78" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="480" y="146" font-size="17" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">"My most surprising result was: ___ and ___ BALANCED."</text><text x="480" y="176" font-size="16" text-anchor="middle" fill="#92400e" font-family="system-ui,-apple-system,sans-serif">"My improvement was ___ and it made my scale more sensitive by ___."</text><text x="480" y="232" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Science words:</text><rect x="60" y="248" width="128" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="124" y="275" font-size="15" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">LEVER</text><rect x="206" y="248" width="128" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="270" y="275" font-size="15" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">FULCRUM</text><rect x="352" y="248" width="128" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="416" y="275" font-size="15" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">BEAM</text><rect x="498" y="248" width="128" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="562" y="275" font-size="15" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">PIVOT</text><rect x="644" y="248" width="148" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="718" y="275" font-size="15" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">PRECISION</text><rect x="810" y="248" width="100" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="860" y="275" font-size="15" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">BALANCE</text><rect x="30" y="315" width="900" height="78" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="345" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Real precision scales used in pharmacies, chemistry labs, and gold merchants</text>
<text x="480" y="371" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">work on the same lever-balance principle!</text>
</svg>