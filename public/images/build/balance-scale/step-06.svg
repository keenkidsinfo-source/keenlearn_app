<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 6 — Make the pans -- 3 strings each</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">For each pan: tie 3 strings equally spaced around the rim. Knot all 3 together at the top.</text><circle cx="238" cy="225" r="76" fill="#f5f5f5" stroke="#1e293b" stroke-width="3"/><text x="238" y="230" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pan circle</text><line x1="238" y1="150" x2="238" y2="100" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/><line x1="304" y1="190" x2="340" y2="148" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/><line x1="304" y1="263" x2="340" y2="306" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/><line x1="238" y1="100" x2="340" y2="148" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/><circle cx="292" cy="82" r="13" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/><text x="292" y="87" font-size="8" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">KNOT</text><text x="192" y="90" font-size="13" fill="#6b7280" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">3 strings equally spaced (120deg)</text><text x="192" y="108" font-size="13" fill="#6b7280" font-family="system-ui,-apple-system,sans-serif">All 3 knotted together at top</text><text x="670" y="145" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Make TWO pans exactly</text><text x="670" y="168" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">the same way.</text><text x="670" y="205" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Strings: equal length.</text><text x="670" y="258" font-size="17" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Both pans must hang</text><text x="670" y="283" font-size="17" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">at the SAME height!</text><rect x="30" y="338" width="900" height="78" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="368" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Space 3 strings evenly like a peace-sign (120 deg apart). Uneven spacing = pan</text>
<text x="480" y="394" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">tilts. Equal spacing = pan hangs flat.</text>
</svg>