<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 6 — Make the pans — 3 strings each</text>

<text x="480" y="90" font-size="17" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">For each pan: tie 3 strings equally spaced around the rim. Knot all 3 together at the top.</text>

<!-- Pan circle — moved well below subtitle -->
<circle cx="230" cy="290" r="82" fill="#f5f5f5" stroke="#1e293b" stroke-width="3"/>
<text x="230" y="295" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pan circle</text>

<!-- 3 strings from rim upward to a shared knot -->
<!-- String 1: top of circle -->
<line x1="230" y1="208" x2="254" y2="148" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
<!-- String 2: upper-right of circle -->
<line x1="301" y1="245" x2="290" y2="148" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
<!-- String 3: lower-right (visible) -->
<line x1="301" y1="340" x2="330" y2="380" stroke="#6b7280" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

<!-- Knot where strings meet -->
<circle cx="270" cy="140" r="14" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/>
<text x="270" y="145" font-size="9" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">KNOT</text>

<!-- Labels for the pan diagram — positioned below knot, away from subtitle -->
<text x="90" y="136" font-size="13" font-weight="bold" fill="#6b7280" font-family="system-ui,-apple-system,sans-serif">3 strings equally spaced</text>
<text x="90" y="153" font-size="13" fill="#6b7280" font-family="system-ui,-apple-system,sans-serif">(120° apart around rim)</text>
<text x="90" y="175" font-size="13" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">All 3 knotted together at top</text>

<!-- Right panel -->
<rect x="520" y="115" width="400" height="250" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="720" y="148" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Make TWO pans exactly</text>
<text x="720" y="170" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">the same way.</text>
<text x="720" y="205" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">✔ Strings: equal length</text>
<text x="720" y="228" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">✔ Same number of strings (3)</text>
<text x="720" y="251" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">✔ Same size pan circle</text>
<text x="720" y="290" font-size="17" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Both pans must hang</text>
<text x="720" y="315" font-size="17" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">at the SAME height!</text>
<text x="720" y="348" font-size="13" text-anchor="middle" fill="#64748b" font-family="system-ui,-apple-system,sans-serif">Unequal pans = scale always biased</text>

<rect x="30" y="420" width="900" height="72" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="452" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Space 3 strings evenly (120° apart, like a peace sign). Uneven spacing = pan tilts.</text>
<text x="480" y="477" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Equal spacing = pan hangs perfectly flat.</text>
</svg>
