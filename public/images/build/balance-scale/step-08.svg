<text x="165" y="200" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Put 1 coin on one pan.</text>
<text x="165" y="218" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Find what balances it.</text>
<text x="165" y="240" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Write the object on the chart!</text>
<text x="165" y="270" font-size="12" text-anchor="middle" fill="#64748b" font-family="system-ui,-apple-system,sans-serif">Try: eraser, button, pebble…</text>

<!-- Challenge 2 -->
<rect x="335" y="85" width="290" height="200" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
<text x="480" y="112" font-size="15" font-weight="bold" text-anchor="middle" fill="#166534" font-family="system-ui,-apple-system,sans-serif">Challenge 2</text>
<circle cx="380" cy="148" r="18" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
<text x="380" y="154" font-size="11" text-anchor="middle" font-weight="bold" fill="#78350f" font-family="system-ui,-apple-system,sans-serif">1¢</text>
<circle cx="410" cy="148" r="18" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
<text x="410" y="154" font-size="11" text-anchor="middle" font-weight="bold" fill="#78350f" font-family="system-ui,-apple-system,sans-serif">1¢</text>
<circle cx="440" cy="148" r="18" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
<text x="440" y="154" font-size="11" text-anchor="middle" font-weight="bold" fill="#78350f" font-family="system-ui,-apple-system,sans-serif">1¢</text>
<text x="470" y="154" font-size="20" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">=</text>
<rect x="488" y="133" width="90" height="35" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="533" y="156" font-size="13" text-anchor="middle" fill="#64748b" font-family="system-ui,-apple-system,sans-serif">? object</text>
<text x="480" y="200" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Put 3 coins on one pan.</text>
<text x="480" y="218" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Find 1 object that balances all 3.</text>
<text x="480" y="240" font-size="13" text-anchor="middle" fill="#166534" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Write the object on the chart!</text>
<text x="480" y="270" font-size="12" text-anchor="middle" fill="#64748b" font-family="system-ui,-apple-system,sans-serif">Try: coin, rock, pencil cap…</text>

<!-- Challenge 3 -->
<rect x="650" y="85" width="290" height="200" rx="12" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
<text x="795" y="112" font-size="15" font-weight="bold" text-anchor="middle" fill="#6b21a8" font-family="system-ui,-apple-system,sans-serif">Challenge 3 🏆 Precision!</text>
<circle cx="740" cy="153" r="20" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
<text x="740" y="159" font-size="12" text-anchor="middle" font-weight="bold" fill="#78350f" font-family="system-ui,-apple-system,sans-serif">1¢</text>
<text x="775" y="159" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">vs</text>
<circle cx="808" cy="148" r="18" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
<text x="808" y="154" font-size="11" text-anchor="middle" font-weight="bold" fill="#78350f" font-family="system-ui,-apple-system,sans-serif">1¢</text>
<circle cx="838" cy="148" r="18" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
<text x="838" y="154" font-size="11" text-anchor="middle" font-weight="bold" fill="#78350f" font-family="system-ui,-apple-system,sans-serif">1¢</text>
<text x="795" y="200" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">1 coin on one pan,</text>
<text x="795" y="218" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">2 coins on the other.</text>
<text x="795" y="238" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Does the beam tip?</text>
<text x="795" y="258" font-size="13" text-anchor="middle" fill="#6b21a8" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Yes = PRECISE scale! 🏆</text>

<rect x="20" y="305" width="920" height="72" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="337" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Coins are perfect weights — every coin of the same type weighs exactly the same.</text>
<text x="480" y="362" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Record your results on the class chart. Who has the most sensitive scale?</text>

<!-- Class chart preview -->
<rect x="20" y="395" width="920" height="128" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
