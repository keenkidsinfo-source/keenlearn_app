<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 8 — 3 coin challenges</text>

<!-- Challenge 1 -->
<rect x="20" y="85" width="290" height="200" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
