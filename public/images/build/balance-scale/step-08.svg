<rect x="345" y="428" width="270" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="480" y="453" font-size="13" text-anchor="middle" fill="#166534" font-family="system-ui,-apple-system,sans-serif">What weighs the same as 3 coins?</text>
<rect x="650" y="428" width="270" height="40" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="785" y="453" font-size="12" text-anchor="middle" fill="#6b21a8" font-family="system-ui,-apple-system,sans-serif">Detects 1 vs 2 coins? (Yes/No) 🏆</text>
<text x="480" y="508" font-size="13" text-anchor="middle" fill="#64748b" font-family="system-ui,-apple-system,sans-serif">Fill in all 3 columns for your name on the chart!</text>
