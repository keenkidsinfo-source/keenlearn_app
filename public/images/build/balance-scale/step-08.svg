<text x="140" y="161" font-size="20" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">=</text>
<rect x="160" y="138" width="90" height="35" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
