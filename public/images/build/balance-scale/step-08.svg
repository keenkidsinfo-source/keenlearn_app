<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">challenge  Step 8 — 3 weighing challenges</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Your scale should detect even tiny differences. Try these 3 challenges!</text><rect x="40" y="108" width="272" height="148" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" rx="10"/><text x="176" y="135" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Challenge 1</text><text x="176" y="158" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Find 2 objects that</text><text x="176" y="177" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">BALANCE exactly.</text><text x="176" y="196" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Beam stays level.</text><text x="176" y="243" font-size="15" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Find the equal pair</text><rect x="344" y="108" width="272" height="148" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" rx="10"/><text x="480" y="135" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Challenge 2</text><text x="480" y="158" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Find 3 small objects</text><text x="480" y="177" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">that together balance</text><text x="480" y="196" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">1 big object.</text><text x="480" y="243" font-size="15" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">3 small = 1 big</text><rect x="648" y="108" width="272" height="148" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" rx="10"/><text x="784" y="135" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Challenge 3</text><text x="784" y="158" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Can your scale detect</text><text x="784" y="177" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">1 paperclip vs</text><text x="784" y="196" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">2 paperclips?</text><text x="784" y="243" font-size="15" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Sensitivity test</text><rect x="30" y="282" width="900" height="78" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="312" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Record ALL results on the class chart. Who has the most sensitive scale? What</text>
<text x="480" y="338" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">design difference explains it?</text>
</svg>