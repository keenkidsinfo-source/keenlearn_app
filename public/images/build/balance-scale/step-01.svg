<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 1 — Meet your materials</text>

<!-- Subtitle -->
<text x="480" y="88" font-size="17" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">2 uprights + 1 beam pivot in a gap. Pans hang from each end. No clay needed!</text>

<!-- Row 1 labels -->
<text x="100" y="122" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Beam (long stick)</text>
<rect x="28" y="128" width="145" height="22" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="4"/>

<!-- 2 uprights shown side-by-side -->
<text x="260" y="122" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">2 uprights (gap between)</text>
<rect x="205" y="128" width="22" height="22" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="2"/>
<rect x="232" y="128" width="22" height="22" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="2"/>
<text x="260" y="157" font-size="10" text-anchor="middle" fill="#64748b" font-family="system-ui,-apple-system,sans-serif">← tiny gap</text>

<!-- Cardstock base -->
<rect x="330" y="108" width="110" height="60" fill="#a3c96e" stroke="#1e293b" stroke-width="3" rx="8"/>
<text x="385" y="140" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Cardstock</text>
<text x="385" y="155" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">base (flat)</text>

<!-- 6 strings -->
<text x="530" y="112" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">6 strings</text>
<line x1="495" y1="120" x2="565" y2="120" stroke="#6b7280" stroke-width="3"/>
<line x1="495" y1="134" x2="565" y2="134" stroke="#6b7280" stroke-width="3"/>
<line x1="495" y1="148" x2="565" y2="148" stroke="#6b7280" stroke-width="3"/>
<text x="530" y="163" font-size="11" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">15 cm each</text>

<!-- Pan A -->
<circle cx="695" cy="128" r="28" fill="#f5f5f5" stroke="#1e293b" stroke-width="3"/>
<text x="695" y="132" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pan A</text>
<text x="695" y="170" font-size="12" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">2 cardstock circles</text>

<!-- Pan B -->
<circle cx="820" cy="128" r="28" fill="#f5f5f5" stroke="#1e293b" stroke-width="3"/>
<text x="820" y="132" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pan B</text>
<text x="820" y="170" font-size="12" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">2 cardstock circles</text>

<!-- Description -->
<text x="480" y="222" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Two uprights stand side-by-side on the base. The beam rests in the gap between them.</text>
<text x="480" y="248" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">The gap IS the fulcrum — beam pivots left/right. Equal pans = PRECISION LEVER balance!</text>

<rect x="30" y="278" width="900" height="72" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="308" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Plus: masking tape + small objects (coins, rocks, erasers, nuts, buttons).</text>
<text x="480" y="334" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Also a pen to mark the true centre of the beam.</text>
</svg>
