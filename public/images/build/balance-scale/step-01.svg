<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 1 — Meet your materials</text>
<text x="480" y="88" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">A precision balance scale: popsicle beam + clay base + string pans. Detects tiny differences!</text>

<!-- Vertical stick (post) -->
<text x="117" y="118" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Vertical stick (post)</text>
<rect x="40" y="124" width="155" height="22" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="4"/>

<!-- Horizontal stick (beam) -->
<text x="297" y="118" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Horizontal stick (beam)</text>
<rect x="220" y="124" width="155" height="22" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="4"/>

<!-- Cardstock base + clay -->
<rect x="420" y="108" width="90" height="60" fill="#a3c96e" stroke="#1e293b" stroke-width="3" rx="8"/>
<text x="465" y="142" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Cardstock</text>
<text x="465" y="157" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">base + clay</text>

<!-- 6 strings -->
<line x1="570" y1="120" x2="640" y2="120" stroke="#6b7280" stroke-width="3"/>
<line x1="570" y1="134" x2="640" y2="134" stroke="#6b7280" stroke-width="3"/>
<line x1="570" y1="148" x2="640" y2="148" stroke="#6b7280" stroke-width="3"/>
<text x="605" y="112" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">6 strings</text>
<text x="605" y="165" font-size="11" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">15 cm each</text>

<!-- Pan A -->
<text x="730" y="99" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">2 cardstock</text>
<text x="730" y="113" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">circles</text>
<circle cx="730" cy="134" r="28" fill="#f5f5f5" stroke="#1e293b" stroke-width="3"/>
<text x="730" y="138" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pan A</text>

<!-- Pan B -->
<circle cx="840" cy="134" r="28" fill="#f5f5f5" stroke="#1e293b" stroke-width="3"/>
<text x="840" y="138" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pan B</text>

<text x="480" y="228" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Scale must detect tiny weight differences. The horizontal beam pivots on the vertical post.</text>
<text x="480" y="253" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Equal pans + a free-swinging beam = a true PRECISION LEVER balance!</text>

<rect x="30" y="280" width="900" height="72" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="310" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Plus: masking tape + small objects (coins, rocks, erasers, nuts, buttons).</text>
<text x="480" y="336" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Also a pen to mark the beam centre.</text>
</svg>
