<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 4 — Find the TRUE centre of the beam</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Balance the horizontal stick on your finger. Where it balances = the true centre. Mark it with pen!</text><rect x="162" y="185" width="635" height="20" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="4"/><text x="440" y="180" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">tilts right (beam is off-centre on finger)</text><rect x="162" y="265" width="635" height="20" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="4"/><circle cx="456" cy="274" r="13" fill="#f0f4f8" stroke="#16a34a" stroke-width="3"/><text x="456" y="279" font-size="9" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">finger</text><text x="456" y="305" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">TRUE centre -- mark with pen dot</text><text x="200" y="358" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">The real balance point may not be</text><text x="200" y="378" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">the geometric middle of the stick.</text><text x="200" y="398" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Wood is not perfectly uniform.</text><text x="720" y="358" font-size="16" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Mark the true centre</text><text x="720" y="380" font-size="16" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">with a clear PEN DOT.</text><rect x="30" y="428" width="900" height="70" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="458" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Off-centre pivot = one pan always appears lighter. This single step determines</text>
<text x="480" y="484" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">whether your scale gives accurate results.</text>
</svg>