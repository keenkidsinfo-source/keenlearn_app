<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">assemble  Step 7 — Attach the pans + final check</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Tie one pan to each beam end at EQUAL length. Both pans should hang level when empty.</text><rect x="390" y="155" width="24" height="270" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="4"/><rect x="158" y="160" width="546" height="20" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="4"/><circle cx="402" cy="170" r="9" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/><line x1="168" y1="180" x2="168" y2="236" stroke="#6b7280" stroke-width="4"/><line x1="168" y1="236" x2="140" y2="288" stroke="#6b7280" stroke-width="3"/><line x1="168" y1="236" x2="198" y2="288" stroke="#6b7280" stroke-width="3"/><circle cx="168" cy="304" r="34" fill="#f5f5f5" stroke="#1e293b" stroke-width="2"/><text x="168" y="308" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pan A</text><line x1="694" y1="180" x2="694" y2="236" stroke="#6b7280" stroke-width="4"/><line x1="694" y1="236" x2="666" y2="288" stroke="#6b7280" stroke-width="3"/><line x1="694" y1="236" x2="724" y2="288" stroke="#6b7280" stroke-width="3"/><circle cx="694" cy="304" r="34" fill="#f5f5f5" stroke="#1e293b" stroke-width="2"/><text x="694" y="308" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pan B</text><text x="440" y="440" font-size="18" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Empty pans hang level = scale is ready!</text><rect x="30" y="462" width="900" height="66" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="492" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">If one pan hangs lower when empty: shorten that pan's strings slightly. Both</text>
<text x="480" y="518" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">pans start at same height = fair results.</text>
</svg>