<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">post  Step 3 — Add the vertical post</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Push one popsicle stick VERTICALLY into the clay through the top of the base. Must stand firm!</text><ellipse cx="480" cy="318" rx="88" ry="14" fill="#a3c96e" stroke="#1e293b" stroke-width="2"/><rect x="392" y="168" width="176" height="150" fill="#a3c96e" stroke="#1e293b" stroke-width="2"/><ellipse cx="480" cy="168" rx="88" ry="14" fill="#7fbb6a" stroke="#1e293b" stroke-width="2"/><ellipse cx="480" cy="235" rx="88" ry="14" fill="#7c9b6b" stroke="#1e293b" stroke-width="2" opacity="0.75"/><rect x="468" y="78" width="24" height="190" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="4"/><text x="480" y="72" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Vertical post</text><text x="330" y="202" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Push straight down into clay</text><text x="330" y="225" font-size="14" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Must be vertical!</text><text x="640" y="195" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Tape around the base</text><text x="640" y="215" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">of the stick for extra grip</text><rect x="30" y="368" width="900" height="78" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="398" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">The post must be exactly vertical (90 degrees). Look from the side AND front.</text>
<text x="480" y="424" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">A tilted post = false readings.</text>
</svg>