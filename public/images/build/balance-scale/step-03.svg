<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 3 — Mount two uprights side-by-side</text>

<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Tape 2 popsicle sticks VERTICALLY at the CENTRE of the base — tiny gap between them!</text>

<!-- Base -->
<rect x="130" y="300" width="420" height="90" rx="6" fill="#a3c96e" stroke="#1e293b" stroke-width="3"/>
<text x="340" y="352" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Cardstock base</text>

<!-- Two uprights side by side -->
<rect x="312" y="175" width="24" height="128" rx="4" fill="#d4956a" stroke="#1e293b" stroke-width="3"/>
<rect x="342" y="175" width="24" height="128" rx="4" fill="#d4956a" stroke="#1e293b" stroke-width="3"/>

<!-- Gap arrow -->
<line x1="337" y1="150" x2="337" y2="173" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ef4444"/></marker></defs>
<text x="337" y="143" font-size="12" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">← tiny gap →</text>
<text x="337" y="158" font-size="11" text-anchor="middle" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif">(beam pivots here)</text>

<!-- Tape marks -->
<rect x="305" y="270" width="68" height="12" fill="#fbbf24" stroke="#92400e" stroke-width="1" rx="2" opacity="0.9"/>
<text x="420" y="278" font-size="12" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">← tape both sticks to base</text>

<!-- Label: uprights -->
<text x="180" y="235" font-size="14" font-weight="bold" fill="#d4956a" font-family="system-ui,-apple-system,sans-serif">2 uprights</text>
<line x1="260" y1="232" x2="311" y2="232" stroke="#d4956a" stroke-width="2"/>

<!-- Right: instructions box -->
<rect x="600" y="130" width="320" height="240" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="760" y="158" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e" font-family="system-ui,-apple-system,sans-serif">How to do it:</text>
<text x="620" y="182" font-size="13" fill="#374151" font-family="system-ui,-apple-system,sans-serif">1. Hold 2 popsicle sticks side-by-side</text>
<text x="620" y="200" font-size="13" fill="#374151" font-family="system-ui,-apple-system,sans-serif">   — leave a TINY gap between them.</text>
<text x="620" y="224" font-size="13" fill="#374151" font-family="system-ui,-apple-system,sans-serif">2. Tape them TOGETHER near the top.</text>
<text x="620" y="248" font-size="13" fill="#374151" font-family="system-ui,-apple-system,sans-serif">3. Stand them upright at the CENTRE</text>
<text x="620" y="266" font-size="13" fill="#374151" font-family="system-ui,-apple-system,sans-serif">   of the base and tape firmly down.</text>
<text x="620" y="296" font-size="13" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Test: push sideways — must NOT</text>
<text x="620" y="314" font-size="13" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">wobble. Add more tape if needed.</text>
<text x="620" y="350" font-size="12" fill="#64748b" font-family="system-ui,-apple-system,sans-serif">The gap between the 2 sticks</text>
<text x="620" y="366" font-size="12" fill="#64748b" font-family="system-ui,-apple-system,sans-serif">is the FULCRUM — the pivot point.</text>

<rect x="30" y="430" width="900" height="56" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="458" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">The uprights must be exactly VERTICAL (straight up). Look from the side and front.</text>
<text x="480" y="478" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Tilted uprights = beam never levels — your scale will always give false readings.</text>
</svg>
