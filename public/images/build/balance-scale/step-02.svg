<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 2 — Set up the base</text>

<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Lay the cardstock rectangle flat on the table. This is your stable platform.</text>

<!-- Left: base rectangle illustration -->
<text x="255" y="135" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Place flat on a level surface:</text>

<!-- Base rectangle with shadow -->
<rect x="80" y="155" width="360" height="130" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
<rect x="85" y="160" width="350" height="120" rx="6" fill="#a3c96e" stroke="#1e293b" stroke-width="3"/>
<text x="260" y="218" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">CARDSTOCK BASE</text>
<text x="260" y="242" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">~20 cm × 15 cm</text>

<!-- Centre mark -->
<line x1="260" y1="165" x2="260" y2="275" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
<text x="260" y="290" font-size="12" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">centre line (uprights go here)</text>

<!-- Right: why it matters -->
<rect x="570" y="130" width="340" height="190" rx="12" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
<text x="740" y="158" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e" font-family="system-ui,-apple-system,sans-serif">Why does the base matter?</text>
<text x="740" y="182" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">✔ Keeps the whole scale from</text>
<text x="740" y="200" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">   sliding around during weighing.</text>
<text x="740" y="224" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">✔ Gives the uprights a firm,</text>
<text x="740" y="242" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">   flat surface to tape onto.</text>
<text x="740" y="266" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">✔ A wobbly base = bad results!</text>
<text x="740" y="300" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Surface must be flat and level.</text>

<rect x="30" y="360" width="900" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="390" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Mark a light pencil line down the CENTRE of the base — uprights go on this line.</text>
<text x="480" y="412" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Push the base against a book or wall edge if the table is slippery.</text>
</svg>
