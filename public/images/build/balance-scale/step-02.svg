<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">base  Step 2 — Roll the base + fill with clay</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Roll cardstock into a cylinder (~5 cm wide). Tape the seam. Fill bottom half with clay.</text><text x="265" y="126" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Roll tight then tape seam:</text><rect x="180" y="136" width="170" height="12" fill="#a3c96e" stroke="#1e293b" stroke-width="2" rx="3"/><ellipse cx="265" cy="136" rx="85" ry="14" fill="#a3c96e" stroke="#1e293b" stroke-width="2"/><rect x="180" y="136" width="170" height="96" fill="#a3c96e" stroke="#1e293b" stroke-width="2"/><ellipse cx="265" cy="232" rx="85" ry="14" fill="#7fbb6a" stroke="#1e293b" stroke-width="2"/><ellipse cx="265" cy="185" rx="85" ry="14" fill="#7c9b6b" stroke="#1e293b" stroke-width="2" opacity="0.75"/><text x="265" y="190" font-size="13" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">fill with clay</text><text x="265" y="207" font-size="12" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">(bottom half)</text><text x="620" y="138" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Why clay?</text><text x="620" y="162" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Heavy base stops the</text><text x="620" y="182" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">whole scale tipping over.</text><text x="620" y="214" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Clay sets firm and</text><text x="620" y="234" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">anchors the post tightly.</text><rect x="30" y="285" width="900" height="78" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="315" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Roll from the SHORT edge for a narrower, more stable cylinder. Tape the full</text>
<text x="480" y="341" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">length of the seam. Clay fills at least half.</text>
</svg>