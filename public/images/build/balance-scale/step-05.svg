<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 5 — Mount the beam — must swing freely</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Lay the beam across the two uprights AT the pen-dot centre. It rests in the gap between them.</text>

<!-- Base -->
<rect x="160" y="350" width="430" height="50" rx="6" fill="#a3c96e" stroke="#1e293b" stroke-width="2"/>
<text x="375" y="382" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Base</text>

<!-- Two uprights -->
<rect x="350" y="210" width="22" height="143" rx="3" fill="#d4956a" stroke="#1e293b" stroke-width="2"/>
<rect x="378" y="210" width="22" height="143" rx="3" fill="#d4956a" stroke="#1e293b" stroke-width="2"/>

<!-- Beam (horizontal) -->
<rect x="165" y="196" width="420" height="18" rx="4" fill="#c49a4a" stroke="#92400e" stroke-width="2"/>

<!-- Pen dot at true centre -->
<circle cx="375" cy="205" r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
<text x="430" y="190" font-size="12" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">pen dot = true centre</text>
<line x1="430" y1="193" x2="384" y2="205" stroke="#ef4444" stroke-width="1.5"/>

<!-- Gap label -->
<text x="375" y="172" font-size="12" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">gap (fulcrum)</text>
<line x1="375" y1="176" x2="375" y2="193" stroke="#1e40af" stroke-width="2"/>

<!-- Swing arrows -->
<text x="130" y="175" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">swings up</text>
<text x="130" y="240" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">swings down</text>
<line x1="165" y1="205" x2="165" y2="180" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
<line x1="165" y1="205" x2="165" y2="230" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>

<!-- Tape note -->
<text x="620" y="215" font-size="13" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Optional: tiny tape loop</text>
<text x="620" y="233" font-size="13" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif">across the top to keep beam</text>
<text x="620" y="251" font-size="13" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif">from sliding — still swings!</text>

<text x="480" y="310" font-size="18" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Test: flick one end — it should swing and return to level!</text>

<rect x="30" y="340" width="900" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="370" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">If beam does NOT swing freely, the gap may be too tight. Gently loosen the uprights slightly.</text>
<text x="480" y="396" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">The beam MUST pivot left/right or the scale will not work.</text>
</svg>
