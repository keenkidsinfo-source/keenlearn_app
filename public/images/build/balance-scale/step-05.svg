<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">mount  Step 5 — Mount the beam -- must swing freely</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Lay the beam across the top of the vertical post AT the pen-dot. Tiny tape loop to keep it on.</text><rect x="452" y="98" width="24" height="296" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="4"/><rect x="200" y="104" width="558" height="20" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="4"/><circle cx="466" cy="114" r="11" fill="#fbbf24" stroke="#ef4444" stroke-width="3"/><text x="466" y="118" font-size="8" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">tape</text><text x="555" y="140" font-size="13" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">tiny tape loop -- just enough</text><text x="555" y="157" font-size="13" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif">to stay on, still swings freely</text><text x="160" y="82" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">swings up</text><text x="160" y="155" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">swings down</text><text x="480" y="310" font-size="18" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Test: flick one end -- it should swing and return to level!</text><rect x="30" y="340" width="900" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="370" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">If beam does NOT swing freely, the tape loop is too tight. Loosen slightly.</text>
<text x="480" y="396" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">The beam MUST pivot or the scale will not work.</text>
</svg>