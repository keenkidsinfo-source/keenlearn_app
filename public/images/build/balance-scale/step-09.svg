<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">improve  Step 9 — Fix + improve sensitivity</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Can you make the scale MORE sensitive? Try ONE improvement, then retest.</text><rect x="40" y="112" width="268" height="175" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="10"/><text x="174" y="140" font-size="16" text-anchor="middle" fill="#14532d" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Longer beam arms</text><text x="174" y="163" font-size="14" text-anchor="middle" fill="#166534" font-family="system-ui,-apple-system,sans-serif">Move pans further from</text><text x="174" y="182" font-size="14" text-anchor="middle" fill="#166534" font-family="system-ui,-apple-system,sans-serif">the centre pivot --</text><text x="174" y="201" font-size="14" text-anchor="middle" fill="#166534" font-family="system-ui,-apple-system,sans-serif">tiny weights create</text><text x="174" y="220" font-size="14" text-anchor="middle" fill="#166534" font-family="system-ui,-apple-system,sans-serif">more tip force.</text><text x="174" y="270" font-size="16" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">most effective fix</text><rect x="346" y="112" width="268" height="175" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="10"/><text x="480" y="140" font-size="16" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Lighter pans</text><text x="480" y="163" font-size="14" text-anchor="middle" fill="#1d4ed8" font-family="system-ui,-apple-system,sans-serif">Heavy pans hide small</text><text x="480" y="182" font-size="14" text-anchor="middle" fill="#1d4ed8" font-family="system-ui,-apple-system,sans-serif">weight differences.</text><text x="480" y="201" font-size="14" text-anchor="middle" fill="#1d4ed8" font-family="system-ui,-apple-system,sans-serif">Trim cardstock circles</text><text x="480" y="220" font-size="14" text-anchor="middle" fill="#1d4ed8" font-family="system-ui,-apple-system,sans-serif">smaller.</text><text x="480" y="270" font-size="16" text-anchor="middle" fill="#3b82f6" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">good improvement</text><rect x="652" y="112" width="268" height="175" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="786" y="140" font-size="16" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Better pivot</text><text x="786" y="163" font-size="14" text-anchor="middle" fill="#78350f" font-family="system-ui,-apple-system,sans-serif">Re-mark true centre by</text><text x="786" y="182" font-size="14" text-anchor="middle" fill="#78350f" font-family="system-ui,-apple-system,sans-serif">balancing on finger.</text><text x="786" y="201" font-size="14" text-anchor="middle" fill="#78350f" font-family="system-ui,-apple-system,sans-serif">A better centre point</text><text x="786" y="220" font-size="14" text-anchor="middle" fill="#78350f" font-family="system-ui,-apple-system,sans-serif">= better accuracy.</text><text x="786" y="270" font-size="16" text-anchor="middle" fill="#f59e0b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">fixes bias</text><rect x="30" y="310" width="900" height="78" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="340" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Make ONE change, retest with a paperclip difference. Only change one thing at</text>
<text x="480" y="366" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">a time or you will not know what helped.</text>
</svg>