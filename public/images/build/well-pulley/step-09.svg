<rect x="30" y="200" width="290" height="200" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="10"/><text x="175" y="232" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Test checklist:</text><text x="175" y="262" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">⬜ Clockwise = rises?</text><text x="175" y="288" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">⬜ Counter-cw = lowers?</text><text x="175" y="314" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">⬜ String stays wound?</text><text x="175" y="340" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">⬜ Bucket doesn't tip?</text>

