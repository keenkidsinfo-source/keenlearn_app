<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🔩  Step 5 — Install the axle</text>

<text x="480" y="103" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Rest the wooden skewer across BOTH sticks. Tape ends — but it must still SPIN!</text>

<rect x="178" y="130" width="18" height="240" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>
<rect x="764" y="130" width="18" height="240" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>

<rect x="155" y="210" width="650" height="18" fill="#c49a4a" stroke="#5c3d0a" stroke-width="4" rx="9"/>
<text x="480" y="200" font-size="22" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">AXLE (skewer)</text>

<rect x="155" y="206" width="40" height="26" fill="#fbbf24" stroke="#92400e" stroke-width="3" rx="4"/>
<rect x="765" y="206" width="40" height="26" fill="#fbbf24" stroke="#92400e" stroke-width="3" rx="4"/>
<text x="175" y="248" font-size="16" text-anchor="middle" fill="#92400e" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">tape</text>
<text x="785" y="248" font-size="16" text-anchor="middle" fill="#92400e" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">tape</text>

<path d="M 430 180 A 50 50 0 0 1 530 180" fill="none" stroke="#dc2626" stroke-width="4"/>
<polygon points="530,180 518,165 540,165" fill="#dc2626"/>
<text x="480" y="160" font-size="20" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">must spin freely!</text>

<rect x="140" y="330" width="720" height="150" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="12"/>
<text x="480" y="363" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">⚠️  CRITICAL CHECK:</text>
<text x="480" y="393" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Spin the skewer with your fingers right now.</text>
<text x="480" y="420" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">If it doesn't rotate, remove tape and try again with LESS tape.</text>
<text x="480" y="447" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">The axle MUST spin or the machine won't work!</text>

</svg>