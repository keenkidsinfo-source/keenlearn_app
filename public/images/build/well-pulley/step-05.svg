<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🔩  Step 5 — Install the axle</text>

<text x="480" y="103" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Thread the skewer THROUGH the hole in the left stick, across, out through the right.</text>

<rect x="248" y="130" width="18" height="250" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>
<rect x="694" y="130" width="18" height="250" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>

<circle cx="257" cy="158" r="10" fill="#f0f4f8" stroke="#1e293b" stroke-width="4"/>
<circle cx="703" cy="158" r="10" fill="#f0f4f8" stroke="#1e293b" stroke-width="4"/>

<rect x="160" y="150" width="640" height="16" fill="#c49a4a" stroke="#5c3d0a" stroke-width="4" rx="8"/>
<text x="480" y="140" font-size="19" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">SKEWER threads through both holes</text>

<line x1="175" y1="195" x2="175" y2="170" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/><polygon points="175,170 184,188 166,188" fill="#1e40af"/>
<text x="175" y="215" font-size="16" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">enter</text>
<text x="175" y="232" font-size="16" text-anchor="middle" fill="#1e40af" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">here</text>

<line x1="785" y1="195" x2="785" y2="170" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><polygon points="785,170 794,188 776,188" fill="#dc2626"/>
<text x="785" y="215" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">exits</text>
<text x="785" y="232" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">here</text>

<path d="M 420 120 A 60 60 0 0 1 540 120" fill="none" stroke="#16a34a" stroke-width="4"/>
<polygon points="540,120 528,107 550,105" fill="#16a34a"/>
<text x="480" y="108" font-size="18" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">spins freely!</text>

<rect x="140" y="340" width="680" height="140" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="12"/>
<text x="480" y="368" font-size="20" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">⚠️  CRITICAL CHECK:</text>
<text x="480" y="395" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Spin the skewer with your fingers — it MUST rotate freely in the holes.</text>
<text x="480" y="422" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">If stuck, gently wiggle to widen the holes slightly.</text>

</svg>