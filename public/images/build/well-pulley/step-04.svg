<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🪵  Step 4 — Add the uprights</text>

<text x="480" y="103" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Push sticks into each side of the cylinder, then punch a hole near the top of each.</text>

<rect x="360" y="300" width="240" height="90" fill="#c49a4a" stroke="#92400e" stroke-width="3" rx="6"/>
<rect x="410" y="178" width="140" height="124" fill="#c49a4a" stroke="#1e293b" stroke-width="3" rx="0"/><ellipse cx="480" cy="178" rx="70" ry="22.400000000000002" fill="#c49a4a" stroke="#1e293b" stroke-width="3"/><ellipse cx="480" cy="302" rx="70" ry="22.400000000000002" fill="#c49a4a" stroke="#1e293b99" stroke-width="2"/>

<rect x="348" y="128" width="18" height="222" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>
<rect x="594" y="128" width="18" height="222" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>

<circle cx="357" cy="150" r="9" fill="#f0f4f8" stroke="#1e293b" stroke-width="4"/>
<circle cx="603" cy="150" r="9" fill="#f0f4f8" stroke="#1e293b" stroke-width="4"/>

<text x="185" y="140" font-size="17" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">punch hole →</text>
<text x="185" y="160" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">near top</text>
<line x1="237" y1="150" x2="344" y2="150" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><polygon points="344,150 326,159 326,141" fill="#dc2626"/>

<text x="775" y="140" font-size="17" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">← punch hole</text>
<text x="775" y="160" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">near top</text>
<line x1="722" y1="150" x2="614" y2="150" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><polygon points="614,150 632,141 632,159" fill="#dc2626"/>

<rect x="30" y="290" width="265" height="185" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="10"/><text x="162.5" y="322" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Steps:</text><text x="162.5" y="352" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">1. Push sticks into</text><text x="162.5" y="378" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">   cylinder sides</text><text x="162.5" y="404" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">2. Use pencil tip to</text><text x="162.5" y="430" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">   punch hole near top</text><text x="162.5" y="456" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">3. Holes must line up</text><text x="162.5" y="482" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">   with each other</text>

<rect x="123.27999999999997" y="470" width="713.44" height="36" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="500" font-size="18" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Both holes must be at the SAME HEIGHT — skewer threads through both.</text>

</svg>