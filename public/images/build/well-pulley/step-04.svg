<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🪵  Step 4 — Add the uprights</text>

<text x="480" y="103" font-size="21" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Push one popsicle stick into each SIDE of the cylinder (left &amp; right).</text>

<rect x="360" y="260" width="240" height="100" fill="#c49a4a" stroke="#92400e" stroke-width="3" rx="6"/>
<rect x="410" y="140" width="140" height="122" fill="#c49a4a" stroke="#1e293b" stroke-width="3" rx="0"/><ellipse cx="480" cy="140" rx="70" ry="22.400000000000002" fill="#c49a4a" stroke="#1e293b" stroke-width="3"/><ellipse cx="480" cy="262" rx="70" ry="22.400000000000002" fill="#c49a4a" stroke="#1e293b99" stroke-width="2"/>

<rect x="348" y="100" width="18" height="200" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>
<rect x="594" y="100" width="18" height="200" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>

<line x1="635" y1="100" x2="680" y2="100" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="635" y1="240" x2="680" y2="240" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="657" y1="100" x2="657" y2="240" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="657" y1="240" x2="657" y2="102" stroke="#475569" stroke-width="2" stroke-linecap="round"/><polygon points="657,102 666,120 648,120" fill="#475569"/>
<text x="700" y="175" font-size="18" text-anchor="middle" fill="#475569" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">8–10 cm</text>
<text x="700" y="200" font-size="16" text-anchor="middle" fill="#475569" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">above top</text>

<rect x="30" y="130" width="290" height="250" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="10"/><text x="175" y="162" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">How to insert:</text><text x="175" y="192" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Push INTO the</text><text x="175" y="218" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">corrugated ridges.</text><text x="175" y="244" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">No tape needed if</text><text x="175" y="270" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">it grips tightly.</text><text x="175" y="296" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Tape base only if</text><text x="175" y="322" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">it wobbles.</text>

<rect x="146.79999999999995" y="474" width="666.4000000000001" height="37" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="505" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Sticks must be directly OPPOSITE each other — left and right</text>

</svg>