<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">⚙️  Step 1 — The science: Wheel &amp; Axle</text>

<text x="480" y="103" font-size="21" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">You are building a SIMPLE MACHINE today. Here's how it works:</text>

<rect x="280" y="210" width="400" height="22" fill="#c49a4a" stroke="#1e293b" stroke-width="3" rx="11"/>
<text x="480" y="200" font-size="20" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">AXLE  (skewer)</text>

<circle cx="700" cy="221" r="70" fill="#fed7aa" stroke="#1e293b" stroke-width="4"/>
<text x="700" y="225" font-size="22" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">WHEEL</text>
<text x="700" y="250" font-size="18" text-anchor="middle" fill="#92400e" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">(crank)</text>

<rect x="768" y="207" width="60" height="28" fill="#8B6914" stroke="#1e293b" stroke-width="3" rx="6"/>

<line x1="380" y1="232" x2="380" y2="340" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
<line x1="380" y1="232" x2="360" y2="232" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
<line x1="380" y1="250" x2="355" y2="250" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
<line x1="380" y1="268" x2="360" y2="268" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
<text x="310" y="285" font-size="18" text-anchor="middle" fill="#3b82f6" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">string</text>
<text x="310" y="308" font-size="18" text-anchor="middle" fill="#3b82f6" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">winds up</text>

<polygon points="340,340 420,340 410,410 350,410" fill="#d4956a" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
<line x1="350" y1="340" x2="340" y2="310" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
<line x1="410" y1="340" x2="420" y2="310" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
<text x="380" y="410" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">BUCKET</text>
<text x="380" y="433" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">(rises!)</text>
<line x1="380" y1="430" x2="380" y2="395" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/><polygon points="380,395 389,413 371,413" fill="#16a34a"/>

<path d="M 720 160 A 80 80 0 0 1 780 210" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="745" y="148" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">turn</text>
<text x="745" y="168" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">crank</text>

<rect x="30" y="160" width="220" height="230" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="10"/><text x="140" y="192" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">The chain:</text><text x="140" y="222" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Turn crank</text><text x="140" y="248" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">→ axle spins</text><text x="140" y="274" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">→ string winds</text><text x="140" y="300" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">→ bucket rises!</text>

<rect x="157.44" y="474" width="645.12" height="37" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="505" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">More crank turns = more string wound = bucket rises higher</text>

</svg>