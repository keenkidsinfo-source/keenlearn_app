<text x="480" y="103" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Stack 2 cardboard sheets, roll them tightly into a cylinder, tape the seam.</text>

