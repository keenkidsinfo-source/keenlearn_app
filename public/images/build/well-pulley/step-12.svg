<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🔧  Step 12 — Improve it!</text>

<text x="480" y="103" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Challenge: can you reduce the number of cranks needed? Try ONE thing!</text>

<rect x="30" y="130" width="410" height="310" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="12"/>
<text x="235" y="162" font-size="22" text-anchor="middle" fill="#1d4ed8" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Option A:  Pre-wind</text>
<text x="235" y="190" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Wind the string around</text>
<text x="235" y="215" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">the skewer BEFORE you</text>
<text x="235" y="240" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">start counting.</text>
<rect x="80" y="265" width="310" height="100" fill="white" stroke="#1e293b" stroke-width="2" rx="8"/>
<rect x="155" y="295" width="180" height="18" fill="#c49a4a" stroke="#5c3d0a" stroke-width="3" rx="9"/>
<circle cx="200" cy="304" r="22" fill="none" stroke="#3b82f6" stroke-width="5"/>
<circle cx="200" cy="304" r="30" fill="none" stroke="#3b82f6" stroke-width="3"/>
<circle cx="245" cy="304" r="22" fill="none" stroke="#3b82f6" stroke-width="4"/>
<circle cx="245" cy="304" r="30" fill="none" stroke="#3b82f6" stroke-width="3"/>
<text x="235" y="350" font-size="15" text-anchor="middle" fill="#475569" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">string pre-loaded</text>

<rect x="520" y="130" width="410" height="310" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="12"/>
<text x="725" y="162" font-size="22" text-anchor="middle" fill="#ea580c" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Option B:  Longer crank</text>
<text x="725" y="190" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Make the crank handle</text>
<text x="725" y="215" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">LONGER — each turn</text>
<text x="725" y="240" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">moves more string.</text>
<rect x="540" y="265" width="370" height="100" fill="white" stroke="#1e293b" stroke-width="2" rx="8"/>
<rect x="610" y="295" width="200" height="18" fill="#c49a4a" stroke="#5c3d0a" stroke-width="3" rx="9"/>
<rect x="808" y="277" width="50" height="54" fill="#fed7aa" stroke="#1e293b" stroke-width="3" rx="4"/>
<text x="720" y="315" font-size="14" text-anchor="middle" fill="#94a3b8" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Short crank</text>
<rect x="580" y="265" width="430" height="100" fill="none" stroke="none" stroke-width="0" rx="0"/>
<rect x="808" y="277" width="110" height="54" fill="#fde68a" stroke="#1e293b" stroke-width="3" rx="6"/>
<text x="863" y="308" font-size="16" text-anchor="middle" fill="#ea580c" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Longer!</text>

<rect x="146.79999999999995" y="474" width="666.4000000000001" height="37" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="505" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Make ONE change → retest → record new count. Did it improve?</text>

</svg>