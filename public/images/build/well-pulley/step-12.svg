<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🔧  Step 12 — Improve it!</text>

<text x="480" y="103" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Can you reduce cranks needed? Pick ONE option, change it, recount!</text>

<rect x="18" y="130" width="295" height="295" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="12"/>
<text x="165" y="158" font-size="19" text-anchor="middle" fill="#1d4ed8" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Option A</text>
<text x="165" y="178" font-size="16" text-anchor="middle" fill="#1d4ed8" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Pre-wind the string</text>
<text x="165" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Wind string around skewer</text>
<text x="165" y="224" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">BEFORE counting — bucket</text>
<text x="165" y="243" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">starts higher up!</text>
<rect x="45" y="258" width="240" height="100" fill="white" stroke="#1e293b" stroke-width="2" rx="8"/>
<rect x="90" y="284" width="160" height="15" fill="#c49a4a" stroke="#5c3d0a" stroke-width="3" rx="8"/>
<circle cx="120" cy="292" r="18" fill="none" stroke="#3b82f6" stroke-width="4"/>
<circle cx="120" cy="292" r="26" fill="none" stroke="#3b82f6" stroke-width="3"/>
<circle cx="165" cy="292" r="18" fill="none" stroke="#3b82f6" stroke-width="4"/>
<circle cx="165" cy="292" r="26" fill="none" stroke="#3b82f6" stroke-width="3"/>
<text x="165" y="335" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">string pre-loaded</text>

<rect x="331" y="130" width="295" height="295" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="12"/>
<text x="478" y="158" font-size="19" text-anchor="middle" fill="#ea580c" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Option B</text>
<text x="478" y="178" font-size="16" text-anchor="middle" fill="#ea580c" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Longer cardstock strip</text>
<text x="478" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Tape a 2cm × 25cm strip</text>
<text x="478" y="224" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">to skewer — bigger sweep</text>
<text x="478" y="243" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">= fewer cranks needed!</text>
<rect x="348" y="258" width="260" height="100" fill="white" stroke="#1e293b" stroke-width="2" rx="8"/>
<rect x="375" y="295" width="190" height="14" fill="#c49a4a" stroke="#5c3d0a" stroke-width="3" rx="8"/>
<rect x="562" y="262" width="30" height="80" fill="#fde68a" stroke="#1e293b" stroke-width="3" rx="4"/>
<text x="577" y="307" font-size="12" text-anchor="left" fill="#ea580c" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">25cm</text>
<text x="577" y="321" font-size="12" text-anchor="left" fill="#ea580c" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">strip</text>
<text x="420" y="335" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">longer = fewer cranks</text>

<rect x="644" y="130" width="295" height="295" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="12"/>
<text x="791" y="158" font-size="19" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Option C</text>
<text x="791" y="178" font-size="16" text-anchor="middle" fill="#16a34a" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Wider axle (more tape)</text>
<text x="791" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Wrap extra tape around</text>
<text x="791" y="224" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">the CENTRE of the skewer</text>
<text x="791" y="243" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">— more string per turn!</text>
<rect x="661" y="258" width="260" height="100" fill="white" stroke="#1e293b" stroke-width="2" rx="8"/>
<rect x="688" y="295" width="190" height="14" fill="#c49a4a" stroke="#5c3d0a" stroke-width="3" rx="8"/>
<circle cx="783" cy="302" r="22" fill="#fbbf24" stroke="#92400e" stroke-width="4"/>
<circle cx="783" cy="302" r="16" fill="#fbbf24" stroke="none" stroke-width="0"/>
<text x="791" y="335" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">tape builds up axle</text>

<rect x="114.87999999999994" y="474" width="730.2400000000001" height="37" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="505" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Make ONE change → retest → record new crank count. Did it improve?</text>

</svg>