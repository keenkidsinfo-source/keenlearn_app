<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🪣  Step 7 — Make the bucket</text>

<text x="480" y="103" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Roll a small piece of corrugated cardboard into a mini cylinder = your BUCKET!</text>

<rect x="425" y="180" width="110" height="110" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="0"/><ellipse cx="480" cy="180" rx="55" ry="17.6" fill="#d4956a" stroke="#1e293b" stroke-width="3"/><ellipse cx="480" cy="290" rx="55" ry="17.6" fill="#d4956a" stroke="#1e293b99" stroke-width="2"/>
<text x="480" y="172" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">BUCKET</text>

<line x1="425" y1="183" x2="360" y2="310" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
<line x1="480" y1="180" x2="480" y2="310" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
<line x1="535" y1="183" x2="600" y2="310" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
<text x="360" y="310" font-size="14" text-anchor="middle" fill="#3b82f6" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">str</text>
<text x="480" y="310" font-size="14" text-anchor="middle" fill="#3b82f6" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">str</text>
<text x="600" y="310" font-size="14" text-anchor="middle" fill="#3b82f6" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">str</text>

<line x1="360" y1="310" x2="480" y2="360" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
<line x1="600" y1="310" x2="480" y2="360" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
<line x1="480" y1="310" x2="480" y2="360" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
<circle cx="480" cy="360" r="12" fill="#fbbf24" stroke="#1e293b" stroke-width="3"/>
<text x="480" y="350" font-size="16" text-anchor="middle" fill="#92400e" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">knot</text>

<line x1="480" y1="372" x2="480" y2="420" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
<text x="480" y="440" font-size="18" text-anchor="middle" fill="#3b82f6" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">to axle</text>
<line x1="480" y1="444" x2="480" y2="438" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/><polygon points="480,438 489,456 471,456" fill="#3b82f6"/>

<rect x="640" y="155" width="285" height="235" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="10"/><text x="782.5" y="187" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">3-string trick:</text><text x="782.5" y="217" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Space strings equally</text><text x="782.5" y="243" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">around the rim</text><text x="782.5" y="269" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">(like a tripod).</text><text x="782.5" y="295" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Gather all 3 ends</text><text x="782.5" y="321" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">to ONE knot.</text><text x="782.5" y="347" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Bucket hangs LEVEL!</text>

<rect x="162.76" y="474" width="634.48" height="37" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="505" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Test: hold the combined knot — does bucket hang straight?</text>

