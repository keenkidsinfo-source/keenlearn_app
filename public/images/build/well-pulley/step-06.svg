<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🧵  Step 6 — Attach the string</text>

<text x="480" y="103" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Glue one end of the twine to the CENTRE of the skewer, then wind it 4–5 times.</text>

<rect x="248" y="130" width="18" height="240" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>
<rect x="694" y="130" width="18" height="240" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>

<rect x="225" y="208" width="510" height="16" fill="#c49a4a" stroke="#5c3d0a" stroke-width="4" rx="8"/>
<text x="480" y="198" font-size="18" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">skewer (axle)</text>

<circle cx="480" cy="216" r="14" fill="#fef08a" stroke="#1e293b" stroke-width="3"/>
<text x="480" y="170" font-size="17" text-anchor="middle" fill="#ca8a04" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">glue dot here</text>
<line x1="480" y1="177" x2="480" y2="200" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/><polygon points="480,200 471,182 489,182" fill="#ca8a04"/>
<text x="318" y="185" font-size="15" text-anchor="right" fill="#ca8a04" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">← press string end</text>
<text x="318" y="200" font-size="15" text-anchor="right" fill="#ca8a04" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">   into glue,</text>
<text x="318" y="215" font-size="15" text-anchor="right" fill="#ca8a04" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">   hold 10 sec</text>

<circle cx="480" cy="216" r="26" fill="none" stroke="#3b82f6" stroke-width="5"/>
<circle cx="480" cy="216" r="36" fill="none" stroke="#3b82f6" stroke-width="3"/>
<circle cx="480" cy="216" r="44" fill="none" stroke="#3b82f6" stroke-width="2"/>

<line x1="480" y1="252" x2="480" y2="430" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
<text x="530" y="340" font-size="18" text-anchor="middle" fill="#3b82f6" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">twine hangs</text>
<text x="530" y="362" font-size="18" text-anchor="middle" fill="#3b82f6" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">into well</text>

<rect x="118.23999999999995" y="470" width="723.5200000000001" height="36" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="500" font-size="18" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Wind in ONE direction — always clockwise or always counter-clockwise.</text>

