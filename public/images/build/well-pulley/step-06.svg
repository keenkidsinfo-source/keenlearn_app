<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🧵  Step 6 — Attach the string</text>

<text x="480" y="103" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Put a glue dot at the CENTRE of the skewer. Press in one end of twine, then wind 4–5×.</text>

<rect x="248" y="145" width="18" height="230" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>
<rect x="694" y="145" width="18" height="230" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>

<rect x="225" y="218" width="510" height="16" fill="#c49a4a" stroke="#5c3d0a" stroke-width="4" rx="8"/>
<text x="480" y="212" font-size="16" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">skewer (axle)</text>

<circle cx="480" cy="226" r="14" fill="#fef08a" stroke="#1e293b" stroke-width="3"/>
<text x="480" y="170" font-size="17" text-anchor="middle" fill="#ca8a04" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">glue dot here ↓</text>
<line x1="480" y1="178" x2="480" y2="210" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/><polygon points="480,210 471,192 489,192" fill="#ca8a04"/>

<circle cx="480" cy="226" r="26" fill="none" stroke="#3b82f6" stroke-width="5"/>
<circle cx="480" cy="226" r="36" fill="none" stroke="#3b82f6" stroke-width="3"/>
<circle cx="480" cy="226" r="44" fill="none" stroke="#3b82f6" stroke-width="2"/>

<line x1="480" y1="262" x2="480" y2="430" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
<text x="548" y="350" font-size="18" text-anchor="middle" fill="#3b82f6" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">twine hangs</text>
<text x="548" y="372" font-size="18" text-anchor="middle" fill="#3b82f6" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">into well</text>

<rect x="30" y="280" width="280" height="170" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="10"/><text x="170" y="312" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">How to attach:</text><text x="170" y="342" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">1. Press string end into glue dot</text><text x="170" y="368" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">2. Hold 10 seconds to grip</text><text x="170" y="394" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">3. Wind 4–5 times same direction</text><text x="170" y="420" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">4. Let rest hang down into well</text>

<rect x="118.23999999999995" y="470" width="723.5200000000001" height="36" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="500" font-size="18" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Wind in ONE direction — always clockwise or always counter-clockwise.</text>

</svg>