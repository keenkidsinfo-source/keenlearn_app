<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🧵  Step 6 — Attach the string</text>

<text x="480" y="103" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Tie one end to the CENTRE of the skewer. Wind it 3–4 times. Let the rest hang.</text>

<rect x="178" y="130" width="18" height="240" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>
<rect x="764" y="130" width="18" height="240" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>

<rect x="155" y="210" width="650" height="18" fill="#c49a4a" stroke="#5c3d0a" stroke-width="4" rx="9"/>
<text x="480" y="200" font-size="18" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">skewer (axle)</text>

<circle cx="480" cy="219" r="10" fill="#fbbf24" stroke="#1e293b" stroke-width="3"/>
<text x="480" y="180" font-size="18" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">tie here</text>
<line x1="480" y1="175" x2="480" y2="168" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/><polygon points="480,168 489,186 471,186" fill="#1e40af"/>

<circle cx="480" cy="219" r="28" fill="none" stroke="#3b82f6" stroke-width="5"/>
<circle cx="480" cy="219" r="36" fill="none" stroke="#3b82f6" stroke-width="3"/>

<line x1="480" y1="247" x2="480" y2="420" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
<text x="525" y="350" font-size="18" text-anchor="middle" fill="#3b82f6" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">string</text>
<text x="525" y="375" font-size="18" text-anchor="middle" fill="#3b82f6" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">hangs</text>
<text x="525" y="400" font-size="18" text-anchor="middle" fill="#3b82f6" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">down</text>
<text x="525" y="420" font-size="18" text-anchor="middle" fill="#3b82f6" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">into well</text>
<line x1="510" y1="415" x2="492" y2="410" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/><polygon points="492,410 511.7521171474138,406.1459283614803 506.9345275992641,423.48925073481917" fill="#3b82f6"/>

<rect x="640" y="180" width="280" height="230" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="10"/><text x="780" y="212" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Steps:</text><text x="780" y="242" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">1. Tie knot at centre</text><text x="780" y="268" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">2. Wind 3–4 times</text><text x="780" y="294" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">3. Let rest hang down</text><text x="780" y="320" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">4. The bucket attaches</text><text x="780" y="346" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">   to the hanging end</text>

<rect x="103.11999999999995" y="475" width="753.7600000000001" height="36" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="505" font-size="18" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Wind in ONE direction — it will unwind cleanly when you lower the bucket</text>

</svg>