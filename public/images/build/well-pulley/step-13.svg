t-weight="normal" font-family="system-ui,-apple-system,sans-serif">full turns</text><rect x="640" y="402" width="230" height="56" fill="#ede9fe" stroke="none" stroke-width="0" rx="8"/><text x="755" y="424" font-size="18" text-anchor="middle" fill="#7c3aed" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">MECH. ADV.</text><text x="755" y="446" font-size="14" text-anchor="middle" fill="#6b21a8" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">less force needed</text>

