<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🎡  Step 8 — Add the crank</text>

<text x="480" y="103" font-size="21" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Tape the cardstock strip to ONE END of the skewer — this is your CRANK!</text>

<rect x="178" y="130" width="18" height="250" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>
<rect x="764" y="130" width="18" height="250" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>

<rect x="155" y="210" width="650" height="18" fill="#c49a4a" stroke="#5c3d0a" stroke-width="4" rx="9"/>

<rect x="765" y="190" width="90" height="58" fill="#fed7aa" stroke="#1e293b" stroke-width="4" rx="6"/>
<text x="810" y="213" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">CRANK</text>
<text x="810" y="235" font-size="16" text-anchor="middle" fill="#92400e" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">(handle)</text>

<rect x="763" y="205" width="18" height="28" fill="#fbbf24" stroke="#92400e" stroke-width="3" rx="4"/>
<text x="745" y="265" font-size="16" text-anchor="middle" fill="#92400e" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">tape</text>

<path d="M 810 160 A 55 55 0 0 1 870 220" fill="none" stroke="#dc2626" stroke-width="4"/>
<polygon points="870,220 855,210 872,198" fill="#dc2626"/>
<text x="840" y="152" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">TURN</text>
<text x="840" y="178" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">to wind</text>
<text x="840" y="200" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">string!</text>

<rect x="30" y="160" width="280" height="240" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="10"/><text x="170" y="192" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Wheel & Axle:</text><text x="170" y="222" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Crank = the WHEEL</text><text x="170" y="248" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">(big radius)</text><text x="170" y="274" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif"></text><text x="170" y="300" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Skewer = the AXLE</text><text x="170" y="326" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">(small radius)</text><text x="170" y="352" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif"></text><text x="170" y="378" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Big wheel, small axle</text><text x="170" y="404" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">= MECHANICAL ADVANTAGE</text>

<rect x="120.19999999999999" y="474" width="719.6" height="37" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="505" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">The LONGER the crank handle, the easier it is to wind the string!</text>

</svg>