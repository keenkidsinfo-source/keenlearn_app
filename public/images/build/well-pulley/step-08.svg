<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🎡  Step 8 — Add the crank</text>

<text x="480" y="103" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Cut cardstock 2 cm wide × 15 cm long. Tape one short end firmly to the TIP of the skewer.</text>

<rect x="220" y="148" width="18" height="232" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>
<rect x="580" y="148" width="18" height="232" fill="#8B6914" stroke="#5c3d0a" stroke-width="3" rx="4"/>

<rect x="200" y="215" width="520" height="18" fill="#c49a4a" stroke="#5c3d0a" stroke-width="4" rx="9"/>

<rect x="686" y="120" width="42" height="100" fill="#fde68a" stroke="#1e293b" stroke-width="4" rx="5"/>
<text x="707" y="115" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">CRANK</text>
<text x="707" y="196" font-size="12" text-anchor="middle" fill="#92400e" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">= strip</text>

<rect x="684" y="212" width="46" height="20" fill="#fbbf24" stroke="#92400e" stroke-width="3" rx="3"/>
<text x="644" y="254" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">← tape here</text>
<text x="644" y="271" font-size="13" text-anchor="middle" fill="#92400e" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">   2-3× wrap</text>

<text x="742" y="120" font-size="14" text-anchor="left" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">← PINCH</text>
<text x="742" y="137" font-size="14" text-anchor="left" fill="#dc2626" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">   far end +</text>
<text x="742" y="154" font-size="14" text-anchor="left" fill="#dc2626" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">   sweep full</text>
<text x="742" y="171" font-size="14" text-anchor="left" fill="#dc2626" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">   circle</text>

<rect x="738" y="185" width="140" height="38" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="6"/>
<text x="808" y="209" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">= 1 CRANK</text>

<path d="M 700 122 A 42 42 0 0 1 742 162" fill="none" stroke="#dc2626" stroke-width="3"/>
<polygon points="742,162 730,155 736,141" fill="#dc2626"/>

<rect x="30" y="148" width="260" height="210" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="10"/><text x="160" y="180" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Cardstock strip:</text><text x="160" y="210" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Width: 2 cm</text><text x="160" y="236" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Length: 15 cm (first try)</text><text x="160" y="262" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Use stiff cardstock</text><text x="160" y="288" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Tape VERY firmly so</text><text x="160" y="314" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">strip cannot spin loose!</text>

<rect x="130.83999999999997" y="474" width="698.32" height="37" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="505" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Each full sweep of the strip = 1 CRANK. Count each full circle!</text>

</svg>