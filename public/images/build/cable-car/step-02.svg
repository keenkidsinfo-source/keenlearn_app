<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">✂️  Step 2 — Cut two strings (30 cm each)</text>
<text x="480" y="97" font-size="19" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Cut TWO separate strings, each about 30 cm long (wrist to elbow). Must be same length!</text><line x1="100" y1="200" x2="500" y2="200" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/><text x="300" y="185" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">String 1 — 30 cm</text><line x1="100" y1="240" x2="500" y2="240" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/><text x="300" y="225" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">String 2 — 30 cm</text><text x="80" y="200" font-size="22" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">|</text><text x="510" y="200" font-size="22" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">|</text><text x="520" y="225" font-size="20" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">✂️</text><text x="580" y="225" font-size="16" fill="#374151" font-family="system-ui,-apple-system,sans-serif">cut here</text><text x="700" y="185" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Hold them side by side</text><text x="700" y="207" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">before cutting to make</text><text x="700" y="229" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">sure they are the</text><text x="700" y="251" font-size="15" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">SAME LENGTH!</text><rect x="30" y="375" width="900" height="118" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="405" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Equal length strings = cup hangs level. If one string is longer the cup will</text>
<text x="480" y="431" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">tilt and the cargo will fall out.</text>
</svg>