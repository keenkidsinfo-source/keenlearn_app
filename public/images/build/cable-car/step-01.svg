<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🚡  Step 1 — Meet your materials</text>

<text x="480" y="103" font-size="22" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Check that you have everything before building:</text>

<rect x="55" y="135" width="210" height="38" fill="#4ade80" stroke="#1e293b" stroke-width="3" rx="19"/>
<text x="160" y="125" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">STRAW</text><text x="160" y="148" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">(your pulley!)</text>

<polygon points="360,125 500,125 480,240 380,240" fill="#d4956a" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
<text x="430" y="118" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Paper cup</text>

<text x="660" y="155" font-size="44" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">📎📎📎</text>
<text x="660" y="115" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Paperclips</text>

<path d="M60 270 Q100 250 140 270 Q180 290 220 270 Q260 250 300 270 Q340 290 380 270" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="220" y="305" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">String (~30 cm)</text>

<rect x="455" y="250" width="100" height="38" fill="#fbbf24" stroke="#1e293b" stroke-width="3" rx="19"/>
<text x="505" y="280" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Tape</text>

<text x="660" y="265" font-size="54" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">✂️</text>
<text x="660" y="310" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Scissors</text>

<text x="800" y="250" font-size="54" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">✏️</text>
<text x="800" y="310" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pencil</text>

<rect x="30" y="345" width="900" height="145" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="385" font-size="22" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">💡  Your STRAW is ALREADY on the zip line — don't remove it!</text>
<text x="480" y="418" font-size="19" text-anchor="middle" fill="#1e40af" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Lay out everything else and check it's all there.</text>
<text x="480" y="448" font-size="19" text-anchor="middle" fill="#1e40af" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Ask your teacher if anything is missing.</text>

</svg>