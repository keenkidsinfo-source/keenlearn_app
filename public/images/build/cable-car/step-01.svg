<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 1 - Meet your materials</text>
<text x="480" y="95" font-size="19" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Check you have all 5 things before you start:</text>

<!-- Item 1: Wide Straw (x=96) -->
<rect x="30" y="130" width="132" height="36" fill="#a3c96e" stroke="#1e293b" stroke-width="3" rx="18"/>
<text x="96" y="183" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Wide STRAW</text>
<text x="96" y="202" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">(on zip line already!)</text>

<!-- Item 2: Cup with 2 holes (x=288) -->
<polygon points="228,130 348,130 333,195 243,195" fill="#d4956a" stroke="#1e293b" stroke-width="3"/>
<circle cx="248" cy="130" r="7" fill="#f0f4f8" stroke="#1e293b" stroke-width="2"/>
<circle cx="328" cy="130" r="7" fill="#f0f4f8" stroke="#1e293b" stroke-width="2"/>
<text x="288" y="218" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Cup (2 holes)</text>

<!-- Item 3: 2 Strings (x=480) -->
<line x1="395" y1="145" x2="565" y2="145" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
<line x1="395" y1="168" x2="565" y2="168" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
<text x="480" y="200" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">2 strings (~30 cm)</text>
<text x="480" y="219" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">one per hole</text>

<!-- Item 4: Small rocks (x=672) -->
<circle cx="645" cy="148" r="18" fill="#78716c" stroke="#1e293b" stroke-width="2"/>
<circle cx="672" cy="160" r="14" fill="#57534e" stroke="#1e293b" stroke-width="2"/>
<circle cx="658" cy="172" r="12" fill="#6b7280" stroke="#1e293b" stroke-width="2"/>
<text x="665" y="203" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Small rocks</text>
<text x="665" y="222" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">(cargo)</text>

<!-- Item 5: Tape + scissors (x=864) -->
<rect x="815" y="135" width="98" height="38" fill="#fbbf24" stroke="#1e293b" stroke-width="3" rx="19"/>
<text x="864" y="159" font-size="17" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Tape</text>
<text x="864" y="200" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">+ scissors</text>

<!-- Divider line -->
<line x1="30" y1="238" x2="930" y2="238" stroke="#cbd5e1" stroke-width="1"/>

<!-- Key facts -->
<text x="480" y="272" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">The STRAW is your PULLEY - it slides along the zip line!</text>
<text x="480" y="298" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Each STRING goes through ONE hole in the cup and ties to one end of the straw.</text>
<text x="480" y="324" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">ROCKS go inside the cup as cargo - gravity pulls them and makes the car slide!</text>

<!-- Tip box -->
<rect x="30" y="352" width="900" height="88" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="382" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">The straw is already on the zip line. Do NOT remove it! Lay everything else out</text>
<text x="480" y="408" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">and ask your teacher if anything is missing.</text>
</svg>