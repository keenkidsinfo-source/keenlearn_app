<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🔵  Step 3 — Punch 2 holes in the cup rim</text>
<text x="480" y="97" font-size="19" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Use a pencil tip to punch ONE hole on each side of the cup rim — opposite each other!</text><polygon points="310,145 590,145 565,300 335,300" fill="#d4956a" stroke="#1e293b" stroke-width="3"/><line x1="310" y1="145" x2="590" y2="145" stroke="#1e293b" stroke-width="5"/><circle cx="332" cy="145" r="10" fill="#f0f4f8" stroke="#ef4444" stroke-width="3"/><text x="332" y="149" font-size="10" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">hole</text><circle cx="568" cy="145" r="10" fill="#f0f4f8" stroke="#ef4444" stroke-width="3"/><text x="568" y="149" font-size="10" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">hole</text><text x="210" y="142" font-size="15" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">LEFT hole</text><line x1="260" y1="143" x2="322" y2="143" stroke="#ef4444" stroke-width="2"/><text x="690" y="142" font-size="15" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">RIGHT hole</text><line x1="638" y1="143" x2="578" y2="143" stroke="#ef4444" stroke-width="2"/><text x="180" y="220" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Use a pencil tip</text><text x="180" y="240" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">to make a small</text><text x="180" y="260" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">clean hole.</text><text x="740" y="220" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Holes should be</text><text x="740" y="240" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">opposite each</text><text x="740" y="260" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">other (left + right).</text><text x="480" y="340" font-size="17" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Hole must be big enough to thread string through!</text><rect x="30" y="375" width="900" height="118" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="405" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Make the hole near the TOP of the rim, not in the middle of the cup. Push a</text>
<text x="480" y="431" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">pencil tip through gently with a small twist.</text>
</svg>