<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🔧  Step 9 — Fix time!</text>

<text x="480" y="103" font-size="21" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Why did it stop? Make ONE change and retest.</text>

<rect x="30" y="130" width="410" height="310" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="12"/>
<text x="235" y="165" font-size="21" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">❌  Common problems:</text>
<text x="120" y="200" font-size="19" text-anchor="left" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">•  Cup is tilting sideways</text>
<text x="120" y="230" font-size="19" text-anchor="left" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">•  Tape is touching the straw</text>
<text x="120" y="260" font-size="19" text-anchor="left" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">•  Cargo is piled on one side</text>
<text x="120" y="290" font-size="19" text-anchor="left" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">•  String is caught on something</text>
<text x="120" y="320" font-size="19" text-anchor="left" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">•  Cup is too heavy (too many clips)</text>
<text x="120" y="350" font-size="19" text-anchor="left" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">•  Zip line has too much sag</text>

<rect x="490" y="130" width="440" height="310" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="12"/>
<text x="710" y="165" font-size="21" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">✅  Try these fixes:</text>
<text x="580" y="200" font-size="19" text-anchor="left" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">•  Re-centre cargo evenly</text>
<text x="580" y="230" font-size="19" text-anchor="left" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">•  Remove 1-2 paperclips</text>
<text x="580" y="260" font-size="19" text-anchor="left" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">•  Loosen tape near straw</text>
<text x="580" y="290" font-size="19" text-anchor="left" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">•  Re-thread so cup is level</text>
<text x="580" y="320" font-size="19" text-anchor="left" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">•  Ask teacher to tighten line</text>
<text x="580" y="350" font-size="19" text-anchor="left" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">•  Try just ONE fix at a time!</text>

<rect x="168.07999999999998" y="474" width="623.84" height="37" fill="#ea580c" stroke="none" stroke-width="0" rx="10"/><text x="480" y="505" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">FRICTION is slowing it down. Less friction = more cargo!</text>

</svg>