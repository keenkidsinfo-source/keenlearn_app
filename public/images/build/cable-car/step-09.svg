<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🚦  Step 9 — Slide test — does it move freely?</text>
<text x="480" y="97" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Gently push the cup along the zip line. Does the straw slide smoothly from end to end?</text><line x1="80" y1="185" x2="880" y2="245" stroke="#374151" stroke-width="4" stroke-dasharray="8,4"/><rect x="120" y="175" width="140" height="22" fill="#a3c96e" stroke="#1e293b" stroke-width="2" rx="11"/><line x1="147" y1="197" x2="147" y2="250" stroke="#6b7280" stroke-width="3"/><line x1="237" y1="197" x2="237" y2="250" stroke="#6b7280" stroke-width="3"/><polygon points="110,250 275,250 260,315 125,315" fill="#d4956a" stroke="#1e293b" stroke-width="2"/><line x1="110" y1="250" x2="275" y2="250" stroke="#1e293b" stroke-width="3"/><text x="430" y="200" font-size="36" text-anchor="middle" fill="#16a34a" font-family="system-ui,-apple-system,sans-serif">→→→</text><text x="430" y="230" font-size="15" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">push gently</text><rect x="680" y="208" width="140" height="22" fill="#a3c96e" stroke="#1e293b" stroke-width="2" rx="11" opacity="0.5"/><text x="480" y="360" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">If it catches or jerks: check that the strings are NOT tangled around the straw.</text><text x="480" y="382" font-size="16" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Strings must run straight — not twisted — from straw ends to cup holes.</text><rect x="30" y="410" width="900" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="440" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">The straw must slide freely for a fair test. Untangle any twisted strings and</text>
<text x="480" y="466" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">make sure the knots sit at the very ENDS of the straw.</text>
</svg>