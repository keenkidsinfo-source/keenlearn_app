<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">📊  Step 11 — Round 2 — find your minimum</text>
<text x="480" y="97" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Add rocks ONE at a time. Release after each. Keep going until the cup slides ALL the way!</text><line x1="80" y1="170" x2="880" y2="240" stroke="#374151" stroke-width="4" stroke-dasharray="8,4"/><rect x="100" y="160" width="140" height="22" fill="#a3c96e" stroke="#1e293b" stroke-width="2" rx="11"/><line x1="127" y1="182" x2="127" y2="235" stroke="#6b7280" stroke-width="3"/><line x1="217" y1="182" x2="217" y2="235" stroke="#6b7280" stroke-width="3"/><polygon points="90,235 255,235 240,300 105,300" fill="#d4956a" stroke="#1e293b" stroke-width="2"/><line x1="90" y1="235" x2="255" y2="235" stroke="#1e293b" stroke-width="3"/><circle cx="140" cy="270" r="12" fill="#78716c" stroke="#1e293b" stroke-width="2"/><circle cx="165" cy="275" r="10" fill="#57534e" stroke="#1e293b" stroke-width="2"/><circle cx="152" cy="258" r="9" fill="#6b7280" stroke="#1e293b" stroke-width="2"/><text x="430" y="200" font-size="30" text-anchor="middle" fill="#16a34a" font-family="system-ui,-apple-system,sans-serif">→→→</text><rect x="700" y="210" width="100" height="18" fill="#a3c96e" stroke="#16a34a" stroke-width="2" rx="9"/><text x="750" y="202" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">LOW end</text><text x="750" y="248" font-size="20" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">ALL THE WAY!</text><text x="480" y="340" font-size="17" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Count rocks when it FIRST slides all the way = your MINIMUM!</text><text x="480" y="365" font-size="16" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Write your minimum on the class chart.</text><rect x="30" y="393" width="900" height="95" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="423" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Minimum = the smallest number of rocks that gives gravity enough force to beat</text>
<text x="480" y="449" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">friction. This is your engineering baseline!</text>
</svg>