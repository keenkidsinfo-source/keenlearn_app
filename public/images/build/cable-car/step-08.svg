<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">⚖️  Step 8 — Check the cup hangs level</text>
<text x="480" y="97" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Look at the cup from the side. Is it hanging flat and level? Fix it if it tilts!</text><rect x="80" y="135" width="340" height="25" fill="#a3c96e" stroke="#1e293b" stroke-width="2" rx="12"/><line x1="120" y1="160" x2="120" y2="220" stroke="#6b7280" stroke-width="3"/><line x1="390" y1="160" x2="390" y2="220" stroke="#6b7280" stroke-width="3"/><polygon points="80,220 420,220 405,285 95,285" fill="#d4956a" stroke="#1e293b" stroke-width="2"/><line x1="80" y1="220" x2="420" y2="220" stroke="#1e293b" stroke-width="3"/><circle cx="100" cy="220" r="7" fill="#16a34a" stroke="#1e293b" stroke-width="2"/><circle cx="400" cy="220" r="7" fill="#16a34a" stroke="#1e293b" stroke-width="2"/><text x="250" y="125" font-size="18" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">GOOD — hangs level</text><rect x="550" y="135" width="340" height="25" fill="#a3c96e" stroke="#1e293b" stroke-width="2" rx="12"/><line x1="590" y1="160" x2="590" y2="195" stroke="#6b7280" stroke-width="3"/><line x1="860" y1="160" x2="860" y2="245" stroke="#6b7280" stroke-width="3"/><polygon points="550,205 875,255 853,320 573,270" fill="#d4956a" stroke="#ef4444" stroke-width="2"/><text x="720" y="125" font-size="18" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">FIX — tilted!</text><text x="720" y="340" font-size="15" text-anchor="middle" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif">Re-thread the lower string so the knot</text><text x="720" y="358" font-size="15" text-anchor="middle" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif">is slightly deeper inside the cup.</text><rect x="30" y="380" width="900" height="95" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="410" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">To level the cup: on the LOW side, untie the inside knot, pull the string a tiny</text>
<text x="480" y="436" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">bit LESS through the hole, re-knot. This shortens that side.</text>
</svg>