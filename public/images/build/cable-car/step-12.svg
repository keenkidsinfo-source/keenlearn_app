<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🏎️  Step 12 — Speed race + share out!</text>
<text x="480" y="97" font-size="17" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Add 3 more rocks on top of your minimum. MORE weight = MORE gravity = FASTER!</text>

<!-- Zip line for left cup (minimum) -->
<line x1="60" y1="150" x2="450" y2="210" stroke="#374151" stroke-width="4" stroke-dasharray="8,4"/>
<!-- Straw left cup -->
<rect x="165" y="142" width="120" height="20" fill="#a3c96e" stroke="#1e293b" stroke-width="2" rx="10"/>
<!-- strings left -->
<line x1="190" y1="162" x2="190" y2="205" stroke="#6b7280" stroke-width="3"/>
<line x1="267" y1="162" x2="267" y2="205" stroke="#6b7280" stroke-width="3"/>
<!-- cup left -->
<polygon points="180,205 275,205 263,265 193,265" fill="#d4956a" stroke="#1e293b" stroke-width="2"/>
<line x1="180" y1="205" x2="275" y2="205" stroke="#1e293b" stroke-width="3"/>
<!-- rocks left (minimum = few rocks) -->
<circle cx="210" cy="245" r="10" fill="#78716c" stroke="#1e293b" stroke-width="2"/>
<circle cx="232" cy="250" r="9" fill="#57534e" stroke="#1e293b" stroke-width="2"/>
<circle cx="250" cy="242" r="9" fill="#6b7280" stroke="#1e293b" stroke-width="2"/>
<!-- motion arrows left (slow/short) -->
<line x1="300" y1="195" x2="345" y2="200" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>
<!-- label left -->
<text x="227" y="296" font-size="14" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Minimum rocks</text>
<text x="227" y="314" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Just barely slides</text>

<!-- VS divider -->
<text x="490" y="225" font-size="30" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">VS</text>

<!-- Zip line for right cup (more rocks) -->
<line x1="520" y1="150" x2="910" y2="210" stroke="#374151" stroke-width="4" stroke-dasharray="8,4"/>
<!-- Straw right cup -->
<rect x="625" y="142" width="120" height="20" fill="#a3c96e" stroke="#1e293b" stroke-width="2" rx="10"/>
<!-- strings right -->
<line x1="650" y1="162" x2="650" y2="205" stroke="#6b7280" stroke-width="3"/>
<line x1="727" y1="162" x2="727" y2="205" stroke="#6b7280" stroke-width="3"/>
<!-- cup right -->
<polygon points="640,205 735,205 723,265 653,265" fill="#d4956a" stroke="#1e293b" stroke-width="2"/>
<line x1="640" y1="205" x2="735" y2="205" stroke="#1e293b" stroke-width="3"/>
<!-- rocks right (minimum + 3 more = heavier) -->
<circle cx="662" cy="238" r="10" fill="#78716c" stroke="#1e293b" stroke-width="2"/>
<circle cx="680" cy="248" r="9" fill="#57534e" stroke="#1e293b" stroke-width="2"/>
<circle cx="698" cy="237" r="9" fill="#6b7280" stroke="#1e293b" stroke-width="2"/>
<circle cx="671" cy="254" r="8" fill="#a8a29e" stroke="#1e293b" stroke-width="1.5"/>
<circle cx="690" cy="256" r="8" fill="#78716c" stroke="#1e293b" stroke-width="1.5"/>
<circle cx="706" cy="250" r="7" fill="#57534e" stroke="#1e293b" stroke-width="1.5"/>
<!-- motion arrows right (fast/long, multiple) -->
<line x1="760" y1="193" x2="820" y2="199" stroke="#16a34a" stroke-width="4" marker-end="url(#arrG)"/>
<line x1="775" y1="202" x2="835" y2="208" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
<!-- label right -->
<text x="688" y="296" font-size="14" text-anchor="middle" fill="#15803d" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Minimum + 3 rocks</text>
<text x="688" y="314" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Zooms faster! 🚀</text>

<!-- Arrow markers -->
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
  </marker>
  <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
  </marker>
</defs>

<!-- Discovery banner -->
<rect x="30" y="340" width="900" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="12"/>
<text x="480" y="368" font-size="18" text-anchor="middle" fill="#15803d" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">💡 More rocks = more gravity = always wins! The cup NEVER stops with more weight.</text>
<text x="480" y="390" font-size="15" text-anchor="middle" fill="#166534" font-family="system-ui,-apple-system,sans-serif">Gravity keeps beating friction harder and harder as you add more rocks.</text>

<!-- Share out box -->
<rect x="30" y="420" width="900" height="95" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="447" font-size="17" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Share out to the class:</text>
<text x="480" y="472" font-size="16" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">"My minimum was ___ rocks. With more weight it went ___!"</text>
<text x="480" y="498" font-size="14" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Real cable cars in San Francisco, ski gondolas, and zip lines all use this same pulley + gravity science! 🚡⛷️</text>
</svg>
