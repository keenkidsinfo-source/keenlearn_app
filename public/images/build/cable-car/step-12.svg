<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">📈  Step 12 — Round 3 — maximum + share out!</text>
<text x="480" y="97" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Keep adding rocks one at a time. When the cup STOPS again — that count minus 1 = your MAXIMUM!</text><line x1="80" y1="170" x2="880" y2="240" stroke="#374151" stroke-width="4" stroke-dasharray="8,4"/><rect x="100" y="160" width="140" height="22" fill="#a3c96e" stroke="#1e293b" stroke-width="2" rx="11"/><line x1="127" y1="182" x2="127" y2="235" stroke="#6b7280" stroke-width="3"/><line x1="217" y1="182" x2="217" y2="235" stroke="#6b7280" stroke-width="3"/><polygon points="90,235 255,235 240,300 105,300" fill="#d4956a" stroke="#1e293b" stroke-width="2"/><line x1="90" y1="235" x2="255" y2="235" stroke="#1e293b" stroke-width="3"/><circle cx="130" cy="275" r="11" fill="#78716c" stroke="#1e293b" stroke-width="2"/><circle cx="152" cy="282" r="10" fill="#57534e" stroke="#1e293b" stroke-width="2"/><circle cx="170" cy="272" r="10" fill="#6b7280" stroke="#1e293b" stroke-width="2"/><circle cx="141" cy="260" r="9" fill="#78716c" stroke="#1e293b" stroke-width="2"/><circle cx="163" cy="258" r="8" fill="#57534e" stroke="#1e293b" stroke-width="2"/><text x="175" y="320" font-size="14" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">TOO MANY!</text><text x="480" y="200" font-size="22" text-anchor="middle" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif">STOP</text><text x="480" y="225" font-size="15" text-anchor="middle" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif">too heavy to slide</text><text x="480" y="320" font-size="17" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Share out: "My minimum was ___ rocks. My maximum was ___ rocks!"</text><text x="480" y="345" font-size="16" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Fix time: cup tilting? Adjust the inside knot on the lower side.</text><text x="480" y="368" font-size="16" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Straw catching? Untwist strings.</text><rect x="30" y="396" width="900" height="95" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="426" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Real cable cars use gravity + weight to slide. You just discovered the</text>
<text x="480" y="452" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">engineering principle behind San Francisco cable cars and ski gondolas!</text>
</svg>