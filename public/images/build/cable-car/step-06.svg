<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🎪  Step 6 — Tie String 1 to the LEFT end of the straw</text>
<text x="480" y="97" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Take the outside end of String 1 (left side). Tie it firmly to the LEFT end of the straw.</text><rect x="130" y="148" width="700" height="30" fill="#a3c96e" stroke="#1e293b" stroke-width="3" rx="15"/><text x="480" y="169" font-size="13" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">ZIP LINE STRAW (already on the line)</text><line x1="155" y1="178" x2="155" y2="280" stroke="#6b7280" stroke-width="4"/><circle cx="155" cy="145" r="12" fill="#fbbf24" stroke="#ef4444" stroke-width="3"/><text x="155" y="150" font-size="9" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">KNOT</text><text x="70" y="150" font-size="14" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">tie here</text><text x="70" y="168" font-size="13" text-anchor="middle" fill="#ef4444" font-family="system-ui,-apple-system,sans-serif">left end</text><line x1="805" y1="178" x2="805" y2="280" stroke="#6b7280" stroke-width="3" stroke-dasharray="6,4" opacity="0.4"/><text x="860" y="225" font-size="13" text-anchor="middle" fill="#9ca3af" font-family="system-ui,-apple-system,sans-serif">next step</text><polygon points="95,290 215,290 200,360 110,360" fill="#d4956a" stroke="#1e293b" stroke-width="3"/><line x1="95" y1="290" x2="215" y2="290" stroke="#1e293b" stroke-width="4"/><circle cx="113" cy="290" r="7" fill="#16a34a" stroke="#1e293b" stroke-width="2"/><circle cx="197" cy="290" r="7" fill="#f0f4f8" stroke="#1e293b" stroke-width="2"/><text x="480" y="320" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Tie a firm DOUBLE KNOT right at the very end of the straw.</text><text x="480" y="345" font-size="16" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Tug hard to test — it must NOT slip!</text><rect x="30" y="375" width="900" height="95" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="405" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Wrap the string around the straw end twice before knotting. The knot must sit</text>
<text x="480" y="431" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">right at the tip so the string does not slide along the straw.</text>
</svg>