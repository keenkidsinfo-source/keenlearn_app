<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 5 - Thread String 2: right hole, knot inside</text>
<text x="480" y="95" font-size="17" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Do the same on the RIGHT side - String 2 through the right hole, big knot inside.</text>

<!-- Cup (same position as step 4) -->
<polygon points="260,165 460,165 442,305 278,305" fill="#d4956a" stroke="#1e293b" stroke-width="3"/>
<line x1="260" y1="165" x2="460" y2="165" stroke="#1e293b" stroke-width="5"/>

<!-- Left hole: already done (green) -->
<circle cx="278" cy="165" r="9" fill="#16a34a" stroke="#1e293b" stroke-width="2"/>
<text x="278" y="169" font-size="8" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">done</text>
<circle cx="278" cy="190" r="12" fill="#fbbf24" stroke="#1e293b" stroke-width="2" opacity="0.5"/>

<!-- Right hole: this step -->
<circle cx="442" cy="165" r="9" fill="#f0f4f8" stroke="#1e293b" stroke-width="2"/>

<!-- String coming from right, outside the cup -->
<line x1="620" y1="165" x2="451" y2="165" stroke="#6b7280" stroke-width="4"/>
<!-- Arrow showing push direction -->
<text x="540" y="155" font-size="22" text-anchor="middle" fill="#16a34a" font-family="system-ui,-apple-system,sans-serif">&#x2190;</text>
<text x="540" y="185" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">push through</text>

<!-- Outside end label — RIGHT side, clear of subtitle -->
<text x="730" y="150" font-size="13" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">outside end</text>
<text x="730" y="208" font-size="12" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">(ties to straw</text>
<text x="730" y="223" font-size="12" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">in later step)</text>

<!-- From outside label -->
<text x="560" y="130" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">from outside</text>

<!-- String inside cup going down to knot -->
<line x1="442" y1="165" x2="442" y2="202" stroke="#6b7280" stroke-width="4"/>
<!-- Knot inside cup -->
<circle cx="442" cy="216" r="16" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/>
<text x="442" y="221" font-size="10" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">KNOT</text>
<text x="442" y="244" font-size="13" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">inside cup</text>

<!-- Result summary -->
<text x="360" y="330" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">You now have TWO strings - one from each side.</text>
<text x="360" y="352" font-size="16" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Both have a knot INSIDE the cup anchoring them.</text>

<!-- Tip box -->
<rect x="30" y="372" width="900" height="88" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="402" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Tug both strings from outside to make sure neither knot pulls through.</text>
<text x="480" y="428" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Both knots must hold firmly before moving on.</text>
</svg>