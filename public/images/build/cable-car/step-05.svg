<text x="480" y="103" font-size="21" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Tie a knot at each end — then hang the cup over the straw</text>

<rect x="175" y="130" width="610" height="30" fill="#4ade80" stroke="#1e293b" stroke-width="3" rx="15"/>
<text x="480" y="120" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">STRAW  (zip line pulley)</text>

<line x1="320" y1="162" x2="370" y2="243" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
<line x1="640" y1="162" x2="590" y2="243" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>

<circle cx="357" cy="245" r="15" fill="#fbbf24" stroke="#1e293b" stroke-width="3"/>
<text x="290" y="245" font-size="20" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">knot</text>
<circle cx="603" cy="245" r="15" fill="#fbbf24" stroke="#1e293b" stroke-width="3"/>
<text x="675" y="245" font-size="20" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">knot</text>

<polygon points="360,243 600,243 569,438 391,438" fill="#d4956a" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>

<line x1="358" y1="248" x2="602" y2="248" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
<circle cx="358" cy="248" r="5" fill="#16a34a" stroke="none" stroke-width="3"/><circle cx="602" cy="248" r="5" fill="#16a34a" stroke="none" stroke-width="3"/>

<rect x="141.47999999999996" y="432" width="677.0400000000001" height="37" fill="#16a34a" stroke="none" stroke-width="0" rx="10"/><text x="480" y="463" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">✅  Cup hangs LEVEL when strings are same length on both sides</text>
<text x="480" y="495" font-size="18" text-anchor="middle" fill="#475569" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Tilting? Adjust both string ends until cup is level.</text>

