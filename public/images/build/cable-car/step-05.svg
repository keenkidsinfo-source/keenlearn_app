<rect x="30" y="230" width="260" height="195" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="10"/><text x="160" y="262" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">The loop:</text><text x="160" y="292" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Straw sits INSIDE</text><text x="160" y="318" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">the string loop.</text><text x="160" y="344" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">It can't fall off!</text><text x="160" y="370" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">String pulls tight</text><text x="160" y="396" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">around the straw.</text>

<rect x="87.99999999999994" y="470" width="784.0000000000001" height="36" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="500" font-size="18" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pull tight! If cup tilts, untie and re-tie with equal string on both sides.</text>

