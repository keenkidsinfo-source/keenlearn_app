<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🩹  Step 5 — Reinforce the holes</text>

<text x="480" y="103" font-size="21" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Put a small piece of tape over each hole — inside AND outside</text>

<polygon points="365,148 595,148 566,356 394,356" fill="#d4956a" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>

<circle cx="385" cy="181" r="12" fill="#f0f4f8" stroke="#1e293b" stroke-width="4"/>
<rect x="358" y="165" width="55" height="32" fill="#fbbf24" stroke="#92400e" stroke-width="3" rx="4"/>
<text x="265" y="175" font-size="22" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Tape</text>
<text x="265" y="200" font-size="18" text-anchor="middle" fill="#92400e" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">outside</text>
<line x1="305" y1="182" x2="355" y2="182" stroke="#92400e" stroke-width="3" stroke-linecap="round"/><polygon points="355,182 337,191 337,173" fill="#92400e"/>

<circle cx="575" cy="181" r="12" fill="#f0f4f8" stroke="#1e293b" stroke-width="4"/>
<rect x="522" y="165" width="55" height="32" fill="#fbbf24" stroke="#92400e" stroke-width="3" rx="4"/>
<text x="693" y="175" font-size="22" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Tape</text>
<text x="693" y="200" font-size="18" text-anchor="middle" fill="#92400e" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">outside</text>
<line x1="655" y1="182" x2="580" y2="182" stroke="#92400e" stroke-width="3" stroke-linecap="round"/><polygon points="580,182 598,173 598,191" fill="#92400e"/>

<rect x="680" y="280" width="250" height="200" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="10"/><text x="805" y="312" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">🤔  Why?</text><text x="805" y="342" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">When cargo is heavy,</text><text x="805" y="368" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">the string pulls hard</text><text x="805" y="394" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">and can TEAR through</text><text x="805" y="420" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">the cup wall.</text><text x="805" y="446" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="normal" font-family="system-ui,-apple-system,sans-serif">Tape stops that!</text>

<rect x="208.39999999999998" y="473" width="543.2" height="38" fill="#1e293b" stroke="none" stroke-width="0" rx="10"/><text x="480" y="505" font-size="20" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Press tape firmly. Do BOTH sides of each hole.</text>

</svg>