<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">Step 4 - Thread String 1: left hole, knot inside</text>
<text x="480" y="95" font-size="17" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Push String 1 through the LEFT hole from OUTSIDE to INSIDE. Tie a big knot inside the cup.</text>

<!-- Cup centered on left half -->
<polygon points="260,165 460,165 442,305 278,305" fill="#d4956a" stroke="#1e293b" stroke-width="3"/>
<line x1="260" y1="165" x2="460" y2="165" stroke="#1e293b" stroke-width="5"/>
<!-- Left hole -->
<circle cx="278" cy="165" r="9" fill="#f0f4f8" stroke="#1e293b" stroke-width="2"/>

<!-- String coming from left, outside the cup -->
<line x1="100" y1="165" x2="269" y2="165" stroke="#6b7280" stroke-width="4"/>
<!-- Arrow showing push direction -->
<text x="183" y="155" font-size="22" text-anchor="middle" fill="#16a34a" font-family="system-ui,-apple-system,sans-serif">&#x2192;</text>
<text x="183" y="185" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">push through</text>

<!-- Outside end label — positioned clearly above string, no overlap -->
<text x="100" y="150" font-size="13" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">outside end</text>
<text x="100" y="208" font-size="12" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">(ties to straw</text>
<text x="100" y="223" font-size="12" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">in later step)</text>

<!-- String inside cup going down to knot -->
<line x1="278" y1="165" x2="278" y2="202" stroke="#6b7280" stroke-width="4"/>
<!-- Knot inside cup -->
<circle cx="278" cy="216" r="16" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/>
<text x="278" y="221" font-size="10" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">KNOT</text>
<text x="278" y="244" font-size="13" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">inside cup</text>

<!-- Label: from outside -->
<text x="150" y="130" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">from outside</text>

<!-- How-to steps on right -->
<rect x="520" y="140" width="390" height="185" fill="white" stroke="#e2e8f0" stroke-width="2" rx="8"/>
<text x="715" y="168" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">How:</text>
<text x="540" y="193" font-size="15" fill="#374151" font-family="system-ui,-apple-system,sans-serif">1. Push string end through</text>
<text x="540" y="213" font-size="15" fill="#374151" font-family="system-ui,-apple-system,sans-serif">   hole from OUTSIDE</text>
<text x="540" y="238" font-size="15" fill="#374151" font-family="system-ui,-apple-system,sans-serif">2. Pull through so you</text>
<text x="540" y="258" font-size="15" fill="#374151" font-family="system-ui,-apple-system,sans-serif">   have ~5 cm inside</text>
<text x="540" y="283" font-size="15" fill="#374151" font-family="system-ui,-apple-system,sans-serif">3. Tie a big knot on</text>
<text x="540" y="303" font-size="15" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">   the INSIDE end</text>

<!-- Tip box -->
<rect x="30" y="365" width="900" height="88" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="395" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">The knot must be bigger than the hole so it cannot pull back through. Tie it</text>
<text x="480" y="421" font-size="17" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">twice (double knot) and tug hard to test. This knot is the anchor!</text>
</svg>