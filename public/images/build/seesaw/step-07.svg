<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">scale  Step 7 — Which is heavier? Test 4 pairs</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Test 4 pairs of objects. PREDICT which is heavier, then test! Record on the class chart.</text><rect x="40" y="112" width="205" height="88" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" rx="8"/><text x="142" y="136" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pair 1</text><text x="142" y="157" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Coin vs Eraser</text><text x="142" y="188" font-size="13" text-anchor="middle" fill="#6b7280" font-family="system-ui,-apple-system,sans-serif">Which is heavier?</text><rect x="260" y="112" width="205" height="88" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" rx="8"/><text x="362" y="136" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pair 2</text><text x="362" y="157" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Rock vs Button</text><text x="362" y="188" font-size="13" text-anchor="middle" fill="#6b7280" font-family="system-ui,-apple-system,sans-serif">Which is heavier?</text><rect x="480" y="112" width="205" height="88" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" rx="8"/><text x="582" y="136" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pair 3</text><text x="582" y="157" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">3 clips vs 1 coin</text><text x="582" y="188" font-size="13" text-anchor="middle" fill="#6b7280" font-family="system-ui,-apple-system,sans-serif">Which wins?</text><rect x="700" y="112" width="215" height="88" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" rx="8"/><text x="807" y="136" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Pair 4</text><text x="807" y="157" font-size="13" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Pencil cap vs rock</text><text x="807" y="188" font-size="13" text-anchor="middle" fill="#6b7280" font-family="system-ui,-apple-system,sans-serif">Which wins?</text><text x="480" y="255" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">After each test: record which side went down on the class chart.</text><text x="480" y="280" font-size="16" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Were you surprised? Can something SMALL be heavier than something BIG?</text><rect x="30" y="308" width="900" height="78" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="338" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">SIZE does not equal weight! A big cotton ball can be lighter than a small</text>
<text x="480" y="364" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">coin. Your seesaw is a precision scale!</text>
</svg>