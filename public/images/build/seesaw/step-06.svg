<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">test  Step 6 — Test with coins</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Place ONE coin in each seat. Add more to ONE side. What happens?</text><rect x="290" y="270" width="380" height="76" fill="#fde68a" stroke="#1e293b" stroke-width="2" rx="4"/><polygon points="480,162 425,270 535,270" fill="#fb923c" stroke="#1e293b" stroke-width="2"/><rect x="190" y="148" width="580" height="24" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="3"/><rect x="158" y="110" width="74" height="44" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="3"/><text x="195" y="136" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">seat</text><circle cx="180" cy="115" r="13" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/><text x="180" y="120" font-size="9" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">coin</text><rect x="730" y="110" width="74" height="44" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="3"/><text x="767" y="136" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">seat</text><circle cx="748" cy="115" r="13" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/><circle cx="782" cy="115" r="13" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/><circle cx="765" cy="100" r="13" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/><text x="820" y="128" font-size="14" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">heavier!</text><text x="480" y="380" font-size="18" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Heavier side goes DOWN. Equal weight = BALANCE.</text><rect x="30" y="418" width="900" height="78" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="448" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Try 1 coin vs 1 coin = level. Try 3 coins vs 1 coin = 3-coin side drops. Equal</text>
<text x="480" y="474" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">loads balance.</text>
</svg>