<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">beam  Step 4 — Lay the beam (do NOT tape it!)</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Lay the long beam across the TIP of the triangle at the centre. Do NOT tape it down!</text><rect x="170" y="302" width="250" height="80" fill="#fde68a" stroke="#1e293b" stroke-width="3" rx="4"/><polygon points="295,165 240,302 350,302" fill="#fb923c" stroke="#1e293b" stroke-width="3"/><rect x="110" y="152" width="700" height="26" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="4"/><text x="460" y="170" font-size="14" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">BEAM - rests freely on the tip</text><circle cx="460" cy="162" r="10" fill="#fbbf24" stroke="#ef4444" stroke-width="3"/><text x="460" y="225" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">The beam MUST be free to tip left and right. That is how it works!</text><text x="460" y="252" font-size="16" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">If it slides off: fold a tiny V-notch at the beam centre to grip the tip.</text><rect x="30" y="375" width="900" height="118" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="405" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">DO NOT tape the beam to the fulcrum. It must pivot freely. If taped it cannot</text>
<text x="480" y="431" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">tip and the seesaw stops working.</text>
</svg>