<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">explore  Step 8 — Balance two unequal objects</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Put two DIFFERENT objects in the seats. Can you balance them by sliding the beam?</text><text x="480" y="116" font-size="17" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Slide the BEAM left or right on the fulcrum to find the balance point!</text><rect x="240" y="285" width="430" height="66" fill="#fde68a" stroke="#1e293b" stroke-width="2" rx="4"/><polygon points="420,188 368,285 472,285" fill="#fb923c" stroke="#1e293b" stroke-width="2"/><rect x="148" y="174" width="646" height="24" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="3"/><rect x="116" y="136" width="80" height="44" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="3"/><circle cx="145" cy="140" r="13" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/><text x="145" y="145" font-size="9" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">BIG</text><rect x="748" y="136" width="80" height="44" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="3"/><circle cx="772" cy="140" r="9" fill="#78716c" stroke="#1e293b" stroke-width="2"/><text x="772" y="144" font-size="8" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">sm</text><text x="300" y="175" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">beam shifted toward heavier object</text><text x="480" y="374" font-size="17" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Move beam TOWARD heavier object = balance without removing anything!</text><rect x="30" y="406" width="900" height="88" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="436" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Real levers use this trick. Moving the pivot point changes which side tips.</text>
<text x="480" y="462" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">You just discovered MECHANICAL ADVANTAGE!</text>
</svg>