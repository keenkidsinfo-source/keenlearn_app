<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🔲  Step 2 — Set up the base</text>
<text x="480" y="97" font-size="19" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Lay the large cardstock rectangle flat on the table as your stable platform.</text><rect x="200" y="140" width="560" height="120" fill="#fde68a" stroke="#1e293b" stroke-width="3" rx="6"/><text x="480" y="207" font-size="26" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">BASE</text><text x="480" y="236" font-size="17" text-anchor="middle" fill="#92400e" font-family="system-ui,-apple-system,sans-serif">Lay flat on table. This is your stable platform.</text><text x="480" y="310" font-size="16" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">20 cm wide x 15 cm tall</text><rect x="30" y="375" width="900" height="118" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="405" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Place the base on a flat, stable surface. It needs to sit steady. If the table</text>
<text x="480" y="431" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">is uneven, it will affect your results.</text>
</svg>