<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🪜  Step 1 — Meet your materials</text>
<text x="480" y="102" font-size="20" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">All your pieces are pre-cut. Check you have everything before you start!</text><rect x="55" y="118" width="240" height="22" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="4"/><text x="175" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Cardstock BEAM (30 x 5 cm)</text><polygon points="380,110 465,110 450,200 395,200" fill="#fb923c" stroke="#1e293b" stroke-width="3"/><text x="422" y="104" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Triangle FULCRUM</text><rect x="555" y="130" width="100" height="70" fill="#fde68a" stroke="#1e293b" stroke-width="3" rx="4"/><text x="605" y="123" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">BASE (20x15)</text><rect x="710" y="130" width="55" height="55" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="4"/><rect x="785" y="130" width="55" height="55" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="4"/><text x="762" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">2 SEAT squares (5x5 cm)</text><text x="480" y="228" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">A SEESAW is a LEVER. The triangle is the FULCRUM (pivot). Heavier side goes DOWN.</text><text x="480" y="252" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">You will discover the rules of balance by testing real objects today!</text><rect x="30" y="278" width="900" height="72" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="308" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Plus: masking tape + small objects to weigh (coins, erasers, rocks, buttons)</text><rect x="55" y="365" width="840" height="38" fill="#fbbf24" stroke="#1e293b" stroke-width="2" rx="8"/><text x="480" y="390" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">LEVER = beam + fulcrum. The pivot is the FULCRUM. The load goes on each end.</text>
</svg>