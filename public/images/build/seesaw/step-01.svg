<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/>
<text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🪜  Step 1 — Meet your materials</text>

<text x="480" y="90" font-size="20" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">All your pieces are pre-cut. Check you have everything before you start!</text>

<!-- Cardstock BEAM -->
<text x="175" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Cardstock BEAM (30 x 5 cm)</text>
<rect x="55" y="130" width="240" height="22" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="4"/>

<!-- Triangle FULCRUM -->
<text x="422" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Triangle FULCRUM</text>
<polygon points="380,130 465,130 450,210 395,210" fill="#fb923c" stroke="#1e293b" stroke-width="3"/>

<!-- BASE -->
<text x="605" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">BASE (20x15)</text>
<rect x="555" y="130" width="100" height="80" fill="#fde68a" stroke="#1e293b" stroke-width="3" rx="4"/>

<!-- 2 SEAT squares -->
<text x="762" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">2 SEAT squares (5x5 cm)</text>
<rect x="710" y="130" width="55" height="55" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="4"/>
<rect x="785" y="130" width="55" height="55" fill="#d4956a" stroke="#1e293b" stroke-width="3" rx="4"/>

<text x="480" y="248" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">A SEESAW is a LEVER. The triangle is the FULCRUM (pivot). Heavier side goes DOWN.</text>
<text x="480" y="272" font-size="17" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">You will discover the rules of balance by testing real objects today!</text>

<rect x="30" y="292" width="900" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="328" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Plus: masking tape + small objects to weigh (coins, erasers, rocks, buttons)</text>

<rect x="55" y="375" width="840" height="38" fill="#fbbf24" stroke="#1e293b" stroke-width="2" rx="8"/>
<text x="480" y="400" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">LEVER = beam + fulcrum. The pivot is the FULCRUM. The load goes on each end.</text>
</svg>
