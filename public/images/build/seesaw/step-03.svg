<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🔺  Step 3 — Build the fulcrum (pivot)</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Fold the scored flap at the bottom of the triangle flat. Tape it firmly to the CENTRE of the base.</text><rect x="170" y="288" width="260" height="90" fill="#fde68a" stroke="#1e293b" stroke-width="3" rx="4"/><text x="300" y="340" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">BASE (centre)</text><polygon points="300,118 235,288 365,288" fill="#fb923c" stroke="#1e293b" stroke-width="3"/><rect x="255" y="280" width="90" height="18" fill="#fb923c" stroke="#ef4444" stroke-width="2"/><text x="300" y="293" font-size="10" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">fold flat + tape</text><text x="550" y="148" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Steps:</text><text x="550" y="172" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">1  Fold base flap flat</text><text x="550" y="195" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">2  Place at CENTRE of base</text><text x="550" y="218" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">3  Tape flap firmly (all edges)</text><text x="550" y="241" font-size="15" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">4  Push sideways to test stability</text><text x="550" y="272" font-size="17" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Must NOT wobble!</text><rect x="30" y="385" width="900" height="95" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="415" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">This is the FULCRUM. If it wobbles, add more tape around the base fold. A</text>
<text x="480" y="441" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">wobbly fulcrum = inaccurate seesaw.</text>
</svg>