<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">talk  Step 9 — Share out!</text>
<text x="480" y="97" font-size="19" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Tell the class your most surprising result. Then say the science words you learned!</text><rect x="60" y="116" width="840" height="78" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="480" y="148" font-size="17" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">"I tested ___ vs ___ and I was surprised that ___"</text><text x="480" y="178" font-size="16" text-anchor="middle" fill="#92400e" font-family="system-ui,-apple-system,sans-serif">"I balanced two unequal objects by sliding the beam because ___"</text><text x="480" y="232" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Science words from today:</text><rect x="70" y="248" width="140" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="140" y="275" font-size="16" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">LEVER</text><rect x="228" y="248" width="140" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="298" y="275" font-size="16" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">FULCRUM</text><rect x="386" y="248" width="140" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="456" y="275" font-size="16" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">BALANCE</text><rect x="544" y="248" width="140" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="614" y="275" font-size="16" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">LOAD</text><rect x="702" y="248" width="180" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="792" y="275" font-size="16" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">LOAD + FORCE</text><rect x="30" y="312" width="900" height="78" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="342" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">Real levers: seesaws, scissors, crowbars, and bottle openers all work the same</text>
<text x="480" y="368" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">way as your seesaw today!</text>
