<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
<rect width="960" height="540" fill="#f0f4f8"/>
<rect width="960" height="66" fill="#1e293b"/><text x="480" y="43" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif">🪑  Step 5 — Make and attach the seats</text>
<text x="480" y="90" font-size="18" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">Fold each small cardstock square into a shallow box. Tape one seat to each beam end.</text><text x="250" y="128" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Fold seat into shallow box:</text><rect x="140" y="140" width="210" height="120" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="4"/><rect x="140" y="140" width="210" height="14" fill="#fb923c" stroke="#1e293b" stroke-width="1"/><rect x="140" y="140" width="14" height="120" fill="#fb923c" stroke="#1e293b" stroke-width="1"/><rect x="336" y="140" width="14" height="120" fill="#fb923c" stroke="#1e293b" stroke-width="1"/><rect x="140" y="246" width="210" height="14" fill="#fb923c" stroke="#1e293b" stroke-width="1"/><text x="245" y="205" font-size="13" text-anchor="middle" fill="#1e293b" font-family="system-ui,-apple-system,sans-serif">fold up 1 cm on all 4 sides</text><text x="640" y="128" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151" font-family="system-ui,-apple-system,sans-serif">Tape one to each end:</text><rect x="430" y="195" width="520" height="24" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="3"/><rect x="415" y="162" width="72" height="40" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="3"/><text x="451" y="186" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">SEAT</text><rect x="862" y="162" width="72" height="40" fill="#d4956a" stroke="#1e293b" stroke-width="2" rx="3"/><text x="898" y="186" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">SEAT</text><text x="680" y="258" font-size="15" text-anchor="middle" fill="#ef4444" font-weight="bold" font-family="system-ui,-apple-system,sans-serif">Check: beam still tips freely after taping!</text><rect x="30" y="375" width="900" height="118" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="12"/>
<text x="480" y="405" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">One coin per seat should balance roughly level. If the empty beam does not</text>
<text x="480" y="431" font-size="18" text-anchor="middle" fill="#1e40af" font-family="system-ui,-apple-system,sans-serif">balance, check the fulcrum is at the CENTRE of the beam.</text>
</svg>